<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Treino e alimentação montados por IA a partir dos seus exames.">
<link rel="manifest" href="manifest.webmanifest">

<style>
html{-webkit-text-size-adjust:100%;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Visual escuro esportivo, só um tema: grafite com viés azul, um azul elétrico de destaque,
   títulos largos e números condensados de placar. Cartões só onde há um objeto separado. */
:root{
  --bg:#0A0C10; --surface:#13171D; --surface-2:#1A1F27; --line:#252C36; --fg:#EDF1F7; --muted:#98A2B3; --faint:#5E6878;
  --accent:#3D9BFF; --accent-strong:#6BB4FF; --on-accent:#03101F; --accent-soft:rgba(61,155,255,.15); --accent-ink:#8CC4FF; --accent-line:rgba(61,155,255,.45);
  --hero:#1A1F27; --on-hero:#EDF1F7; --hero-muted:#98A2B3;
  --warn-soft:#2E2312; --warn-ink:#FFC266; --bad-soft:#331718; --bad-ink:#FF8A8A; --info-soft:#221D38; --info-ink:#C2B5FF;
  --carb:#B49CFF; --fat:#FFC266;
  --display:'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-card:20px; --r-ctl:14px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
::selection{background:var(--accent);color:var(--on-accent)}
#app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:20px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
#app.entra{animation:entra .28s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em}
h2{font-family:var(--display);font-stretch:108%;font-weight:750;font-size:20px;line-height:1.2;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent-ink)}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-family:var(--display);font-stretch:112%;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px} .stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.hero{position:relative;overflow:hidden;background:var(--surface-2);color:var(--fg);border:1px solid var(--accent-line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero::before{content:"";position:absolute;inset:auto -30% 55% auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,155,255,.22),transparent);pointer-events:none}
.hero > *{position:relative}
.hero .sub{color:var(--muted);font-size:14px}
.hero .grande{font-family:var(--display);font-stretch:75%;font-weight:850;font-size:44px;line-height:.95;letter-spacing:-.01em;text-transform:uppercase}
.dark{background:var(--surface-2);color:var(--on-hero);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:8px}
.dark .eyebrow{color:var(--accent-ink)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
button.tile:active{transform:scale(.98)}
.tile .num,.num{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:32px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .num small{font-family:var(--body);font-stretch:100%;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--on-accent);transition:transform .12s ease,background-color .15s ease}
.btn:hover{background:var(--accent-strong)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border-color:var(--accent-line);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.light{background:var(--accent);color:var(--on-accent)}
.btn.plain{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.plain:hover{background:var(--surface-2)}
.btn.danger{background:transparent;border-color:var(--bad-ink);color:var(--bad-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:var(--accent-soft);color:var(--accent-ink)} .warn{background:var(--warn-soft);color:var(--warn-ink)} .bad{background:var(--bad-soft);color:var(--bad-ink)} .info{background:var(--info-soft);color:var(--info-ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:0 16px}
.list > .li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list > .li:last-child{border-bottom:0}
.li .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 14px;min-height:48px;width:100%;transition:border-color .15s ease,box-shadow .15s ease}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.tabs .chip{font-family:var(--display);font-stretch:75%;font-size:22px;font-weight:800;min-height:52px;border-radius:16px}
.exw{display:flex;flex-direction:column;gap:6px}
.carga-btn{align-self:flex-start;margin-left:46px;font-size:14px;color:var(--accent-ink)}
.avatar-g{width:72px;height:72px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;color:var(--muted)}
.avatar-img{width:100%;height:100%;object-fit:cover;display:block}
.cg-linha{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.cg-linha input{width:100%;min-height:44px}
.exm{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.exm-box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.exm-imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.exm-imgs img{width:100%;height:auto;border-radius:12px;background:#fff;display:block}
.ex{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.ex .exn{flex:none;width:34px;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:22px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.ex.feito .exn{color:var(--accent)}
.ex.feito .txt strong{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.ex .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.check{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--faint);background:transparent;color:var(--on-accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s ease}
.check:active{transform:scale(.9)}
.check[aria-pressed="true"]{border-color:var(--accent);background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.dot{width:34px;height:34px;margin:6px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px dashed var(--faint)}
.dot.done{background:var(--accent);color:var(--on-accent);border:0}
.dot.today{border:2px solid var(--accent)}
.anel{flex:none;display:grid;place-items:center;position:relative}
.anel span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:22px;line-height:1}
.anel small{font-family:var(--body);font-stretch:100%;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.macro{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px}
.macro i{display:block;height:100%;border-radius:999px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.leg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.meal{display:flex;flex-direction:column;gap:6px}
.meal ul{margin:0;padding-left:18px;color:var(--muted)}
.meal li::marker{color:var(--accent)}
details summary::-webkit-details-marker{display:none}
.bubble{padding:12px 14px;border-radius:20px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.status{padding:12px 14px;border-radius:16px;font-size:14px}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s} #app.entra{animation:none} .btn,.check{transition:none}}
.table-wrap{overflow-x:auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(13,16,21,.86);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.bottom button{background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;cursor:pointer;min-height:56px}
nav.bottom button .bar{display:none}
nav.bottom button svg{box-sizing:content-box;padding:4px 18px;border-radius:999px;transition:background-color .2s ease}
nav.bottom button[aria-current="page"]{color:var(--fg);font-weight:700}
nav.bottom button[aria-current="page"] svg{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<body>
<div id="app" aria-live="polite">
  <div class="stack" style="padding-top:40px">
    <span class="eyebrow">Treino e Nutrição</span>
    <h1>Carregando seus dados…</h1>
    <p class="muted">Seu perfil, exames e plano aparecem aqui em instantes.</p>
  </div>
</div>
<nav class="bottom" aria-label="Navegação principal" hidden>
  <div class="in">
    <button data-tab="inicio"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-tab="exames"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Exames</button>
    <button data-tab="treino"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Treino</button>
    <button data-tab="dieta"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2v9M5 3v5M9 3v5M17 3c-2 2-3 4-3 7h3v11"/></svg>Alimentação</button>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
"use strict";
const $app = document.getElementById('app');
const $nav = document.querySelector('nav.bottom');

const S = {
  ready:false, cfg:null,
  tab:'inicio', sub:null,
  perfil:null, foto:null, exames:[], plano:null, registro:{treinos:[]},
  dia:null, feitos:{}, busy:null, erro:null, rascunho:null, chat:[], confirmDel:null, editPerfil:false
};

/* ---------- utilidades ---------- */
const h = (v)=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,d=0)=>{const n=Number(v);return isFinite(n)?n.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';};
const hoje = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtData = (iso)=>{if(!iso)return '';const p=String(iso).split('-');if(p.length<3)return h(iso);const m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+p[1]-1]||p[1];return (+p[2])+' '+m+' '+p[0];};
const uidGen = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* ---------- cofre: dados criptografados (AES-GCM) com uma chave mestra.
   A chave mestra fica guardada duas vezes: travada pela senha e travada pelo código de recuperação. ---------- */
const CHAVES=['perfil','exames','plano','registro','feitos','cfg','cfgVisto','saude','foto'];
const ITER=310000;
const COFRE={key:null, mestra:null, cache:{}, fila:Promise.resolve()};
const rawGet=(k)=>{try{const v=localStorage.getItem('tn:'+k);return v?JSON.parse(v):null;}catch(e){return null;}};
const rawSet=(k,v)=>{localStorage.setItem('tn:'+k,JSON.stringify(v));};
const rawDel=(k)=>{try{localStorage.removeItem('tn:'+k);}catch(e){}};
const b64=(buf)=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);};
const unb64=(t)=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const temCripto=()=>!!(window.crypto&&crypto.subtle&&window.isSecureContext);
async function derivar(segredo,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(segredo),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const chaveDe=(bytes)=>crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function cifrarBytes(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv:b64(iv),ct:b64(ct)};}
async function decifrarBytes(key,pac){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pac.iv)},key,unb64(pac.ct)));}
const cifrar=(key,obj)=>cifrarBytes(key,new TextEncoder().encode(JSON.stringify(obj)));
async function decifrar(key,pac){return JSON.parse(new TextDecoder().decode(await decifrarBytes(key,pac)));}

// código de recuperação: 20 caracteres sem letras ambíguas, em grupos de 4
const ALFA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function gerarCodigo(){const r=crypto.getRandomValues(new Uint8Array(20));let c='';for(let i=0;i<20;i++){c+=ALFA[r[i]%32];if(i%4===3&&i<19)c+='-';}return c;}
const normCodigo=(t)=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/I/g,'1');
async function embrulhar(segredo,mestra){const salt=crypto.getRandomValues(new Uint8Array(16));const k=await derivar(segredo,salt,ITER);return {salt:b64(salt),iter:ITER,pac:await cifrarBytes(k,mestra)};}
async function desembrulhar(segredo,emb){const k=await derivar(segredo,unb64(emb.salt),emb.iter);return decifrarBytes(k,emb.pac);}

async function carregarCache(mestra){
  const key=await chaveDe(mestra); const cache={};
  for(const k of CHAVES){ const pac=rawGet('x:'+k); if(pac){ try{cache[k]=await decifrar(key,pac);}catch(e){} } }
  COFRE.key=key; COFRE.mestra=mestra; COFRE.cache=cache;
}
// abre com a senha (ou com o código, se porCodigo); devolve false se não confere
async function abrirCofre(segredo,porCodigo){
  const c=rawGet('cofre'); if(!c) return false;
  let mestra; try{ mestra=await desembrulhar(porCodigo?normCodigo(segredo):segredo, porCodigo?c.codigo:c.senha); }catch(e){ return false; }
  await carregarCache(mestra); return true;
}
// cria o cofre com os dados em memória; devolve o código de recuperação
async function criarCofre(senha,dados,email){
  const mestra=crypto.getRandomValues(new Uint8Array(32)); const key=await chaveDe(mestra);
  const pacotes={}; for(const k of CHAVES){ if(dados[k]!==undefined&&dados[k]!==null) pacotes[k]=await cifrar(key,dados[k]); }
  const codigo=gerarCodigo();
  const cofre={v:2, senha:await embrulhar(senha,mestra), codigo:await embrulhar(normCodigo(codigo),mestra), email:email||''};
  for(const k of CHAVES){ if(pacotes[k]) rawSet('x:'+k,pacotes[k]); else rawDel('x:'+k); }
  rawSet('cofre',cofre);
  for(const k of CHAVES) rawDel(k);   // apaga cópias antigas sem criptografia
  COFRE.key=key; COFRE.mestra=mestra; COFRE.cache=Object.assign({},dados);
  return codigo;
}
// com o cofre aberto: troca só a senha (dados e código continuam)
async function novaSenha(senha){ const c=rawGet('cofre'); c.senha=await embrulhar(senha,COFRE.mestra); rawSet('cofre',c); }
// com o cofre aberto: novo código (o antigo deixa de valer)

function salvarEmail(email){ const c=rawGet('cofre'); if(c){ c.email=email; rawSet('cofre',c); } }

// formato: {provedor (aba aberta na tela), chaves:{gemini,claude,openai}, modelos:{...}, tarefas:{exames,plano,chat}, reserva:true}
function normCfg(c){
  c=c||{}; if(!c.chaves){ c.chaves={}; c.modelos={}; if(c.chave){ c.chaves[c.provedor||'gemini']=c.chave; c.modelos[c.provedor||'gemini']=c.modelo||''; } }
  c.modelos=c.modelos||{}; c.tarefas=c.tarefas||{}; if(c.reserva===undefined) c.reserva=true;
  c.provedor=PROV[c.provedor]?c.provedor:(Object.keys(PROV).find(k=>c.chaves[k])||'gemini');
  c.chave=c.chaves[c.provedor]||''; c.modelo=c.modelos[c.provedor]||''; return c;
}

function iaDaTarefa(t){ const c=S.cfg, ks=comChave(); const e=c&&c.tarefas&&c.tarefas[t]; return ks.includes(e)?e:(ks.includes(c.provedor)?c.provedor:ks[0]); }
function ordemProvedores(tarefa){ const p=iaDaTarefa(tarefa); return S.cfg.reserva===false?[p]:[p].concat(comChave().filter(k=>k!==p)); }

function blobParaB64(blob){return new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>err({code:'image_rejected'});r.readAsDataURL(blob);});}
async function prepararImagem(blob){
  // reduz para no máximo 1600 px no lado maior e converte para JPEG
  try{
    const bmp=await createImageBitmap(blob);
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
    const out=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return {mime:'image/jpeg', data:await blobParaB64(out)};
  }catch(e){ throw {code:'image_rejected'}; }
}

// Modelos que bateram o limite ficam de fora até a cota voltar (guardado fora do cofre: não é dado pessoal)
function esgotados(){ const e=rawGet('esgotado')||{}; const agora=Date.now(); for(const k in e){ if(e[k]<=agora) delete e[k]; } return e; }
function marcarEsgotado(modelo,msg){
  const e=esgotados(); let ate;
  if(/per ?day|daily|PerDay/i.test(msg||'')){
    // cota diária do Google renova à meia-noite do horário do Pacífico (~08:00 UTC)
    const d=new Date(); d.setUTCHours(8,0,0,0); if(d.getTime()<=Date.now()) d.setUTCDate(d.getUTCDate()+1); ate=d.getTime();
  } else ate=Date.now()+90*1000;   // limite por minuto
  e[modelo]=ate; try{ rawSet('esgotado',e); }catch(_){}
}

async function chamarIA(turns, opts){
  opts=opts||{};
  if(!iaPronta()) throw {code:'sem_chave'};
  if(!navigator.onLine) throw {code:'offline'};
  const provs=opts.so?[opts.so]:ordemProvedores(opts.tarefa||'exames');
  const imgs=[]; for(const b of (opts.images||[])) imgs.push(await prepararImagem(b));
  let ultimoErro=null;
  for(let i=0;i<provs.length;i++){
    try{
      const txt=await chamarProvedor(provs[i], turns, imgs, opts);
      if(i>0) avisarTroca(provs[0],provs[i]);
      return txt;
    }catch(e){
      ultimoErro=e; const c=e&&e.code;
      // erros do pedido (não da IA) não adianta repetir em outra
      if(['cancelled','offline','image_rejected','prompt_too_large','refused'].includes(c)) throw e;
      if(i<provs.length-1&&opts.onStatus) opts.onStatus(PROV[provs[i]].nome.split(' ').pop()+' não respondeu. Usando '+PROV[provs[i+1]].nome.split(' ').pop()+'…');
    }
  }
  throw ultimoErro||{code:'upstream_error'};
}
let avisouTroca={};
function avisarTroca(de,para){ const k=de+'>'+para; if(avisouTroca[k]) return; avisouTroca[k]=true;
  setTimeout(()=>toast(PROV[de].nome.split(' ').pop()+' indisponível ou sem limite agora. Usei o '+PROV[para].nome.split(' ').pop()+'.'),400); }
async function chamarProvedor(provedor, turns, imgs, opts){
  const chave=S.cfg.chaves[provedor]; const escolhido=(S.cfg.modelos[provedor]||'').trim();
  // ordem: modelo escolhido (ou o padrão) e depois os mais leves do mesmo provedor
  const lista=[escolhido||PROV[provedor].modelo].concat((RESERVA[provedor]||[]).filter(x=>x!==escolhido));
  const fora=esgotados();
  let modelos=lista.filter(x=>!fora[x]);
  if(!modelos.length){ if(!opts.so&&S.cfg.reserva!==false&&comChave().length>1) throw {code:'rate_limited'}; modelos=lista.slice(-1); }   // todos esgotados: passa para outra IA, ou tenta o mais leve
  let ultimoErro=null;
  for(let m=0;m<modelos.length;m++){
    for(let tentativa=0;tentativa<2;tentativa++){
      try{
        const txt=await chamarModelo(provedor, chave, modelos[m], turns, imgs, opts);
        if(modelos[m]!==lista[0]) avisarModeloLeve(provedor, modelos[m]);
        return txt;
      }catch(e){
        ultimoErro=e; const c=e&&e.code;
        if(c==='rate_limited'){ marcarEsgotado(modelos[m],e.message); if(m<modelos.length-1&&opts.onStatus) opts.onStatus('Limite do modelo atingido. Trocando para um modelo mais leve…'); break; }
        const passageiro = c==='ocupado';
        const trocar = passageiro || c==='modelo';
        if(!trocar) throw e;
        if(passageiro && tentativa===0){ if(opts.onStatus) opts.onStatus('Modelo ocupado. Tentando de novo…'); await espera(2500,opts.signal); continue; }
        if(m<modelos.length-1 && opts.onStatus) opts.onStatus('Modelo ocupado. Usando um modelo alternativo…');
        break;
      }
    }
  }
  throw ultimoErro||{code:'upstream_error'};
}
let avisouLeve=false;
function avisarModeloLeve(provedor,modelo){
  if(avisouLeve) return; avisouLeve=true;
  const ate=(rawGet('esgotado')||{})[(S.cfg.modelos[provedor]||'').trim()||PROV[provedor].modelo];
  const quando=ate&&ate-Date.now()>3600e3?' até a cota renovar, por volta das '+new Date(ate).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+(new Date(ate).getDate()!==new Date().getDate()?' de amanhã':''):' por enquanto';
  setTimeout(()=>toast('Limite do modelo principal atingido. Usando '+modelo+quando+'.'),400);
}

async function chamarModelo(provedor, chave, modelo, turns, imgs, opts){
  const last=turns.length-1;
  let url, headers, body;
  if(provedor==='gemini'){
    url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(modelo)+':generateContent';
    headers={'content-type':'application/json','x-goog-api-key':chave};
    body={contents:turns.map((t,i)=>({role:t.role==='assistant'?'model':'user',parts:[...(i===last?imgs.map(m=>({inline_data:{mime_type:m.mime,data:m.data}})):[]),{text:t.content}]})),
          generationConfig:opts.json?{responseMimeType:'application/json'}:{}};
  }else if(provedor==='claude'){
    url='https://api.anthropic.com/v1/messages';
    headers={'content-type':'application/json','x-api-key':chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    body={model:modelo,max_tokens:opts.json?12000:1500,messages:turns.map((t,i)=>({role:t.role,content:[...(i===last?imgs.map(m=>({type:'image',source:{type:'base64',media_type:m.mime,data:m.data}})):[]),{type:'text',text:t.content}]}))};
  }else{
    url='https://api.openai.com/v1/chat/completions';
    headers={'content-type':'application/json','authorization':'Bearer '+chave};
    body={model:modelo,messages:turns.map((t,i)=>({role:t.role,content:[{type:'text',text:t.content},...(i===last?imgs.map(m=>({type:'image_url',image_url:{url:'data:'+m.mime+';base64,'+m.data}})):[])]}))};
    if(opts.json) body.response_format={type:'json_object'};
  }
  let r;
  try{ r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal}); }
  catch(e){ if(e&&e.name==='AbortError') throw {code:'cancelled'}; throw {code:'rede'}; }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){
    const msg=(j&&(j.error&&(j.error.message||j.error.type)))||('HTTP '+r.status);
    if(r.status===401||r.status===403) throw {code:'chave',message:msg};
    if(r.status===404) throw {code:'modelo',message:msg};
    if(r.status===503||r.status===529||r.status===500||/overload|high demand|unavailable|capacity/i.test(msg)) throw {code:'ocupado',message:msg};
    if(r.status===429) throw {code:'rate_limited',message:msg};
    if(r.status===400&&/key/i.test(msg)) throw {code:'chave',message:msg};
    if(r.status===413) throw {code:'prompt_too_large',message:msg};
    throw {code:'upstream_error',message:msg};
  }
  let txt='';
  if(provedor==='gemini'){ const c=j&&j.candidates&&j.candidates[0]; txt=(c&&c.content&&c.content.parts||[]).map(p=>p.text||'').join(''); if(!txt&&j&&j.promptFeedback&&j.promptFeedback.blockReason) throw {code:'refused'}; }
  else if(provedor==='claude'){ txt=(j&&j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''); }
  else { txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||''; }
  if(!txt) throw {code:'empty_completion'};
  return txt;
}
function extrairJSON(txt){
  try{return JSON.parse(txt);}catch(e){}
  const f=txt.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){try{return JSON.parse(f[1]);}catch(e){}}
  const a=txt.search(/[\{\[]/), b=Math.max(txt.lastIndexOf('}'),txt.lastIndexOf(']'));
  if(a>=0&&b>a){try{return JSON.parse(txt.slice(a,b+1));}catch(e){}}
  throw {code:'invalid_json',text:txt};
}

function erroIA(e){
  const c=e&&e.code;
  if(c==='sem_chave') return 'Configure a IA antes: toque no ícone de pessoa › Configurar IA.';
  if(c==='offline') return 'Sem internet. Conecte e tente de novo.';
  if(c==='rede') return 'Não consegui falar com o serviço de IA. Confira a internet e tente de novo.';
  if(c==='chave') return 'A chave de API foi recusada. Confira se copiou inteira em Configurar IA.';
  if(c==='modelo') return 'O modelo informado não existe ou não está liberado para essa chave. Em Configurar IA, apague o campo Modelo para usar o padrão.';
  if(c==='ocupado') return 'Os servidores da IA estão sobrecarregados agora. O app já tentou de novo e trocou de modelo. Espere alguns minutos e tente outra vez.';
  if(c==='rate_limited') return 'Todos os modelos atingiram o limite de uso gratuito. A cota renova no dia seguinte. Para não parar, ative a cobrança no site do provedor.';
  if(c==='image_rejected') return 'Não consegui ler esse arquivo. Tente uma foto mais nítida ou outro formato (JPG, PNG ou PDF).';
  if(c==='invalid_json'||c==='empty_completion') return 'A resposta da IA veio incompleta. Tente de novo.';
  if(c==='prompt_too_large') return 'Há informação demais para enviar de uma vez. Apague exames antigos e tente de novo.';
  if(c==='refused') return 'A IA não aceitou esse pedido. Revise os dados e tente de novo.';
  if(c==='cancelled') return null;
  return 'A IA não respondeu agora'+(e&&e.message?' ('+String(e.message).slice(0,140)+')':'')+'. Tente de novo em alguns instantes.';
}

const METODOS_SAUDE=['isAvailable','requestAuthorization','checkAuthorization','readSamples','queryAggregated','queryWorkouts','openHealthConnectSettings','showPrivacyPolicy'];
function plugSaude(){

const TIPOS_SAUDE=['sleep','heartRate','restingHeartRate','heartRateVariability','steps','weight','workouts'];
const diaLocal=(iso)=>{ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const hhmm=(iso)=>{ const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const minutos=(a,b)=>Math.max(0,(new Date(b)-new Date(a))/60000);

// junta as amostras de sono por noite (data do despertar): total dormido, profundo e REM
const ESTADO_SONO={1:'awake',2:'sleeping',3:'outofbed',4:'light',5:'deep',6:'rem',7:'awakeinbed'};
function noitesDeSono(amostras){
  // O plugin pode devolver varios registros com as mesmas etapas (ou fontes sobrepostas).
  // Por isso juntamos os intervalos de cada tipo sem contar o mesmo minuto duas vezes.
  // min = tempo dormido; cama = sessão inteira (como o app do relógio mostra); acordado = interrupções.
  const ehAcordado=(e)=>/^(awake|inbed|outofbed|awakeinbed|out_of_bed|awake_in_bed)$/.test(e);
  const ivs=[]; // {a,b,e,ac}
  for(const s of (amostras||[])){
    const lista=(Array.isArray(s.stages)&&s.stages.length)?s.stages.map(g=>({a:g.startDate,b:g.endDate,e:g.stage})):[{a:s.startDate,b:s.endDate,e:s.sleepState||'asleep'}];
    for(const g of lista){
      const e=ESTADO_SONO[g.e]||String(g.e||'').toLowerCase();
      const a=new Date(g.a).getTime(), b=new Date(g.b).getTime();
      if(!isFinite(a)||!isFinite(b)||b<=a) continue;
      ivs.push({a,b,e,ac:ehAcordado(e)});
    }
  }
  const uniao=(lista)=>{ const o=lista.map(x=>[x.a,x.b]).sort((x,y)=>x[0]-y[0]); const r=[]; for(const [a,b] of o){ const u=r[r.length-1]; if(u&&a<=u[1]) u[1]=Math.max(u[1],b); else r.push([a,b]); } return r; };
  const total=(u)=>u.reduce((t,[a,b])=>t+(b-a)/60000,0);
  const iso=(t)=>new Date(t).toISOString();
  const noites={};
  for(const [a,b] of uniao(ivs)){ // cada bloco contínuo (dormindo + acordado) é uma sessão
    const doBloco=(f)=>ivs.filter(i=>f(i)&&i.a<b&&i.b>a).map(i=>({a:Math.max(i.a,a),b:Math.min(i.b,b)}));
    const dorm=total(uniao(doBloco(i=>!i.ac)));
    if(dorm<=0) continue;
    const k=diaLocal(iso(b));
    const n=noites[k]||(noites[k]={min:0,cama:0,profundo:0,rem:0,inicio:iso(a),fim:iso(b)});
    n.min+=dorm; n.cama+=(b-a)/60000;
    n.profundo+=total(uniao(doBloco(i=>i.e==='deep'))); n.rem+=total(uniao(doBloco(i=>i.e==='rem')));
    if(iso(a)<n.inicio) n.inicio=iso(a); if(iso(b)>n.fim) n.fim=iso(b);
  }
  for(const k in noites){ const n=noites[k]; n.min=Math.round(n.min); n.cama=Math.max(n.min,Math.round(n.cama)); n.profundo=Math.round(n.profundo); n.rem=Math.round(n.rem); if(n.cama>16*60) delete noites[k]; }
  return noites;
}

const LIMITE_SAUDE=/rate.?limit|quota/i;
async function sincronizarSaude(manual){
  const H=plugSaude();
  if(!H){ if(manual) toast(window.Capacitor?'O app não encontrou o módulo do Conexão Saúde. Instale a versão mais recente do APK.':'A leitura do relógio só funciona no app Android.'); return; }
  if(S.saudeBusy) return;
  const ant=S.saude||{};
  const pausa=ant.pausaAte?new Date(ant.pausaAte).getTime()-Date.now():0;
  if(pausa>0){ if(manual) toast('O Conexão Saúde pediu uma pausa nas leituras. Tente de novo em '+Math.ceil(pausa/60000)+' min.'); return; }
  S.saudeBusy=true; if(manual) render();
  try{
    const disp=await H.isAvailable();
    if(!disp||!disp.available) throw {msg:'O Conexão Saúde não está disponível neste celular. Atualize o app "Conexão Saúde" na Play Store e tente de novo.'};
    const aut=await H.requestAuthorization({read:TIPOS_SAUDE});
    const ok=new Set((aut&&aut.readAuthorized)||[]);
    if(!ok.size) throw {msg:'Sem permissão para ler os dados. Toque em Sincronizar e permita o acesso no Conexão Saúde.'};
    const fim=new Date(); const meiaNoite=(n)=>{ const d=new Date(fim); d.setHours(0,0,0,0); d.setDate(d.getDate()-n); return d; };
    // 1ª leitura (ou leitura antiga): 14 dias. Depois, só os 2 últimos dias, somados ao que já foi lido.
    const recente=ant.sincronizado&&(Date.now()-new Date(ant.sincronizado).getTime()<3*864e5)&&ant.dias;
    const pend=new Set(ant.pendentes||[]);
    const sonoReset=ant.vSono!==3; // versão 17: sono antigo vinha somado várias vezes, relê os 14 dias uma vez
    const desde=(t)=>(recente&&!pend.has(t)&&!(t==='sleep'&&sonoReset))?meiaNoite(1):meiaNoite(13);
    const corte=diaLocal(meiaNoite(13));
    const dias={}; for(const k in (ant.dias||{})) if(k>=corte) dias[k]={...ant.dias[k]};
    if(sonoReset) for(const k in dias){ ['sono','sonoCama','sonoIni','sonoFim','sonoProfundo','sonoRem'].forEach(c=>delete dias[k][c]); }
    const D=(k)=>dias[k]||(dias[k]={});
    const limpa=(campos,ini)=>{ const k0=diaLocal(ini); for(const k in dias) if(k>=k0) campos.forEach(c=>delete dias[k][c]); };
    const vazio={...(ant.vazio||{})}; // tipos que o relógio não grava: consulta só 1 vez por semana
    const diag={permitidos:[...ok],negados:(aut&&aut.readDenied)||[],n:{},erros:{}};
    let parou=false; const pendentes=[];
    const ler=async(rotulo,tipo,f)=>{
      if(parou){ pendentes.push(tipo); return null; }
      try{ const r=await f(); const lista=(r&&(r.samples||r.workouts))||[]; diag.n[rotulo]=lista.length; return lista; }
      catch(e){ const m=String((e&&(e.message||e.code))||e); diag.erros[rotulo]=m.slice(0,90);
        if(LIMITE_SAUDE.test(m)){ parou=true; diag.limite=true; } pendentes.push(tipo); return null; }
    };
    const pular=(t)=>vazio[t]&&(Date.now()-new Date(vazio[t]).getTime()<7*864e5);
    const per=(t)=>({startDate:desde(t).toISOString(),endDate:fim.toISOString()});
    // ordem de prioridade: o que mais importa primeiro, caso o Conexão Saúde limite as leituras
    if(ok.has('sleep')){
      const ini=desde('sleep'); const iniS=new Date(ini); iniS.setDate(iniS.getDate()-1);
      const am=await ler('sono','sleep',()=>H.readSamples({startDate:iniS.toISOString(),endDate:fim.toISOString(),dataType:'sleep',limit:1000}));
      if(am){ if(am[0]){ const x=am[0]; diag.amostraSono={campos:Object.keys(x).join(','),estado:x.sleepState||'',etapas:Array.isArray(x.stages)?x.stages.length:0,valor:x.value}; }
        limpa(['sono','sonoCama','sonoIni','sonoFim','sonoProfundo','sonoRem'],ini);
        const noites=noitesDeSono(am); for(const k in noites){ if(k>=corte&&noites[k].min>=60) Object.assign(D(k),{sono:noites[k].min,sonoCama:noites[k].cama,sonoIni:noites[k].inicio,sonoFim:noites[k].fim,sonoProfundo:noites[k].profundo,sonoRem:noites[k].rem}); } }
    }
    if(ok.has('steps')){ const am=await ler('passos','steps',()=>H.queryAggregated({...per('steps'),dataType:'steps',bucket:'day',aggregation:'sum'}));
      if(am) am.forEach(x=>{ if(isFinite(+x.value)) D(diaLocal(x.startDate)).passos=Math.round(+x.value); }); 
      // só na sincronização manual: de qual app vêm os passos de hoje (relógio x celular)
      if(manual&&!parou){ const br=await ler('passosHojeBrutos','steps',()=>H.readSamples({startDate:meiaNoite(0).toISOString(),endDate:fim.toISOString(),dataType:'steps',limit:2000}));
        if(br&&br.length){ const g={}; br.forEach(x=>{ const o=String(x.sourceName||x.sourceId||x.dataOrigin||x.packageName||'desconhecido'); g[o]=(g[o]||0)+(+x.value||0); }); diag.passosPorApp=g; } }
    }
    if(ok.has('heartRate')){
      const pHR=per('heartRate');
      const med=await ler('fcMedia','heartRate',()=>H.queryAggregated({...pHR,dataType:'heartRate',bucket:'day',aggregation:'average'}));
      if(med) med.forEach(x=>{ if(+x.value>0) D(diaLocal(x.startDate)).fcMedia=Math.round(+x.value); });
      const mn=await ler('fcMin','heartRate',()=>H.queryAggregated({...pHR,dataType:'heartRate',bucket:'day',aggregation:'min'}));
      if(mn) mn.forEach(x=>{ if(+x.value>0) D(diaLocal(x.startDate)).fcMin=Math.round(+x.value); });
    }
    if(ok.has('restingHeartRate')&&!pular('restingHeartRate')){
      const am=await ler('fcRepouso','restingHeartRate',()=>H.readSamples({...per('restingHeartRate'),dataType:'restingHeartRate',limit:300}));
      if(am){ if(!am.length) vazio.restingHeartRate=fim.toISOString(); else delete vazio.restingHeartRate;
        am.slice().sort((a,b)=>String(a.startDate).localeCompare(String(b.startDate))).forEach(x=>{ if(+x.value>0){ const d=D(diaLocal(x.startDate)); d.fcRepouso=Math.round(+x.value); delete d.fcRepousoEst; } }); }
    }
    if(ok.has('heartRateVariability')&&!pular('heartRateVariability')){
      const am=await ler('hrv','heartRateVariability',()=>H.readSamples({...per('heartRateVariability'),dataType:'heartRateVariability',limit:500}));
      if(am){ if(!am.length) vazio.heartRateVariability=fim.toISOString(); else delete vazio.heartRateVariability;
        const soma={}; am.forEach(x=>{ if(+x.value>0){ const k=diaLocal(x.startDate); (soma[k]=soma[k]||[]).push(+x.value); } }); for(const k in soma){ D(k).hrv=Math.round(soma[k].reduce((a,b)=>a+b,0)/soma[k].length); } }
    }
    let peso=ant.peso||null;
    const pesoVelho=!ant.pesoLido||(Date.now()-new Date(ant.pesoLido).getTime()>864e5);
    let pesoLido=ant.pesoLido||null;
    if(ok.has('weight')&&(pesoVelho||pend.has('weight'))){
      const am=await ler('peso','weight',()=>H.readSamples({startDate:new Date(fim.getTime()-60*864e5).toISOString(),endDate:fim.toISOString(),dataType:'weight',limit:50}));
      if(am){ pesoLido=fim.toISOString(); const ult=am.slice().sort((a,b)=>String(b.startDate).localeCompare(String(a.startDate)))[0]; if(ult&&+ult.value>0) peso={kg:Math.round(+ult.value*10)/10,data:diaLocal(ult.startDate)}; }
    }
    let treinos=(ant.treinos||[]).filter(t=>t.data>=corte);
    if(ok.has('workouts')){
      const ini=desde('workouts'); const am=await ler('treinos','workouts',()=>H.queryWorkouts({startDate:ini.toISOString(),endDate:fim.toISOString(),limit:60}));
      if(am){ const k0=diaLocal(ini); treinos=treinos.filter(t=>t.data<k0).concat(am.map(w=>({data:diaLocal(w.startDate),tipo:String(w.workoutType||'treino'),min:Math.round((+w.duration||0)/60),kcal:w.totalEnergyBurned?Math.round(+w.totalEnergyBurned):null}))).sort((x,y)=>y.data.localeCompare(x.data)).slice(0,40); }
    }
    // sem FC de repouso gravada pelo relógio: usa a menor frequência do dia como estimativa
    for(const k in dias){ const d=dias[k]; if((!d.fcRepouso||d.fcRepousoEst)&&d.fcMin){ d.fcRepouso=d.fcMin; d.fcRepousoEst=true; } }
    diag.janela=recente?'2 dias (somados aos anteriores)':'14 dias';
    S.saude={vSono:(ok.has('sleep')&&!pendentes.includes('sleep'))?3:ant.vSono,sincronizado:fim.toISOString(),dias,peso,pesoLido,treinos,permitidos:[...ok],diag,vazio,pendentes:[...new Set(pendentes)],
      pausaAte:diag.limite?new Date(Date.now()+15*60e3).toISOString():null};
    await save('saude',S.saude);
    if(manual){
      if(diag.limite) toast('O Conexão Saúde limitou as leituras por agora. O que faltou vem na próxima sincronização, daqui a uns 15 min.');
      else toast(Object.keys(dias).length||treinos.length?'Dados do relógio atualizados.':'Nenhum dado encontrado nos últimos 14 dias. Confira se o app Moto Watch está sincronizando com o Conexão Saúde.');
    }
  }catch(e){ if(manual) toast((e&&e.msg)||'Não consegui ler o Conexão Saúde agora. Tente de novo.'); }
  S.saudeBusy=false; render();
}

// médias dos últimos 7 dias e a última noite, para a tela e para a IA
function resumoSaude(){
  const sd=S.saude; if(!sd||!sd.dias) return null;
  const chaves=Object.keys(sd.dias).sort().reverse(); const hojeK=hoje();
  const ult7=chaves.filter(k=>k>=diaLocal(Date.now()-7*864e5));
  const media=(campo,lista)=>{ const v=(lista||ult7).map(k=>sd.dias[k][campo]).filter(x=>isFinite(x)&&x>0); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; };
  const noite=chaves.find(k=>sd.dias[k].sono);
  const r={ultimaNoite:noite?{data:noite,minutos:sd.dias[noite].sono,cama:sd.dias[noite].sonoCama||sd.dias[noite].sono,ini:sd.dias[noite].sonoIni||null,fim:sd.dias[noite].sonoFim||null,profundo:sd.dias[noite].sonoProfundo||0,rem:sd.dias[noite].sonoRem||0}:null,
    sonoMedioMin:media('sono'), fcRepousoHoje:(sd.dias[hojeK]||{}).fcRepouso||null, fcRepousoEstimada:Object.values(sd.dias).some(d=>d.fcRepousoEst), fcMediaHoje:(sd.dias[hojeK]||{}).fcMedia||null, fcRepousoMedia:media('fcRepouso'), hrvMedia:media('hrv'), passosHoje:(sd.dias[hojeK]||{}).passos||null, passosMedia:media('passos'),
    treinos7d:(sd.treinos||[]).filter(t=>t.data>=diaLocal(Date.now()-7*864e5)).length, peso:sd.peso, atualizado:sd.sincronizado};
  return (r.ultimaNoite||r.fcRepousoMedia||r.passosMedia||r.treinos7d)?r:null;
}
const hm=(min)=>{ if(!isFinite(min)||min==null) return '—'; const h_=Math.floor(min/60), m_=Math.round(min%60); return h_+'h'+String(m_).padStart(2,'0'); };

// recado para o treino do dia, a partir do sono e da FC de repouso
function recadoRecuperacao(){
  const r=resumoSaude(); if(!r) return '';
  const avisos=[];
  if(r.ultimaNoite&&r.ultimaNoite.data>=diaLocal(Date.now()-864e5)&&r.ultimaNoite.minutos<360) avisos.push('Noite curta ('+hm(r.ultimaNoite.minutos)+')');
  if(r.fcRepousoHoje&&r.fcRepousoMedia&&r.fcRepousoHoje>=r.fcRepousoMedia+7) avisos.push('FC de repouso '+r.fcRepousoHoje+' bpm, acima da sua média de '+r.fcRepousoMedia);
  return avisos.length?avisos.join(' e ')+'. Hoje, vá mais leve: tire 1 série de cada exercício e não force até a falha.':'';
}

const NOMES_SAUDE={sleep:'sono',heartRate:'frequência cardíaca',restingHeartRate:'FC de repouso',heartRateVariability:'HRV',steps:'passos',weight:'peso',workouts:'treinos'};
const NOME_APP=(id)=>({'com.motorola.omni':'Moto Watch','com.motorola.watchapp':'Moto Watch','com.sec.android.app.shealth':'Samsung Health','com.google.android.apps.fitness':'Google Fit','com.google.android.apps.healthdata':'Celular (Conexão Saúde)','android':'Celular'}[id]||id);
function diagSaude(sd){
  const g=sd&&sd.diag; if(!g) return '';
  const falta=TIPOS_SAUDE.filter(t=>!g.permitidos.includes(t)).map(t=>NOMES_SAUDE[t]);

  return aviso+`<details class="small muted"><summary style="cursor:pointer;min-height:32px">Detalhes da leitura</summary><div class="stack-s" style="margin-top:6px;overflow-wrap:anywhere">
    <span>Permitido: ${h(g.permitidos.map(t=>NOMES_SAUDE[t]||t).join(', ')||'nada')}</span>
    ${falta.length?`<span>Sem permissão: ${h(falta.join(', '))}</span>`:''}
    <span>Registros lidos: ${h(contagem||'nenhum')}</span>
    ${g.passosPorApp?`<span>Passos de hoje por app: ${h(Object.entries(g.passosPorApp).map(([k,v])=>NOME_APP(k)+' '+Math.round(v).toLocaleString('pt-BR')).join(' · '))}</span>`:''}
    ${g.janela?`<span>Período lido: ${h(g.janela)}</span>`:''}
    ${erros?`<span>Erros: ${h(erros)}</span>`:''}
    ${(sd.pendentes||[]).length?`<span>Fica para a próxima: ${h(sd.pendentes.map(t=>NOMES_SAUDE[t]||t).join(', '))}</span>`:''}
    ${g.amostraSono?`<span>Sono (1º registro): ${h(JSON.stringify(g.amostraSono))}</span>`:''}
  </div></details>`;
}

  const botao=NATIVO?`<button class="btn ghost" style="min-height:40px;padding:0 14px" data-act="sincSaude"${S.saudeBusy?' disabled':''}>${S.saudeBusy?'Lendo…':'Sincronizar'}</button>`:'';

      <div class="stack-s" style="gap:2px"><span class="small muted" style="font-weight:600">FC repouso</span><span class="num" style="font-size:26px">${r.fcRepousoHoje||r.fcRepousoMedia||'—'}<small> bpm</small></span><span class="small muted">${r.fcRepousoMedia?(r.fcRepousoEstimada?'mín. do dia · média ':'média ')+r.fcRepousoMedia:'sem dados'}</span></div>
      <div class="stack-s" style="gap:2px"><span class="small muted" style="font-weight:600">Passos</span><span class="num" style="font-size:26px">${r.passosHoje!=null?num(r.passosHoje):'—'}</span><span class="small muted">${r.passosMedia?'média '+num(r.passosMedia):'hoje'}</span></div>
    </div>
    ${barras}
    ${diagSaude(sd)}
    ${n?`<p class="small muted">Última noite${n.ini&&n.fim?' ('+hhmm(n.ini)+' às '+hhmm(n.fim)+')':''}: dormido ${hm(n.minutos)}${n.cama>n.minutos?', mais '+hm(n.cama-n.minutos)+' acordado':''}. Profundo ${hm(n.profundo)} · REM ${hm(n.rem)} · leve ${hm(Math.max(0,n.minutos-n.profundo-n.rem))}${r.hrvMedia?' · HRV média '+r.hrvMedia+' ms':''}.</p>`:(r.hrvMedia?`<p class="small muted">HRV média ${r.hrvMedia} ms.</p>`:'')}
  </div>`;
}

function contexto(){
  const p=S.perfil||{};
  const ex=S.exames.slice(0,8).map(e=>({tipo:e.tipo,data:e.data,itens:(e.itens||[]).map(i=>[i.nome,i.valor,i.unidade,refCurta(i.referencia),i.situacao,(i.anteriores&&i.anteriores.length)?'antes: '+i.anteriores.map(a=>a.valor+' em '+a.data).join(', '):''].filter(Boolean).join(' | '))}));
  const rs=resumoSaude();

}

// Reconstrói as linhas da página a partir da posição de cada trecho de texto.
// Espaços grandes entre trechos viram 3 espaços, para separar colunas.
async function linhasDaPagina(page){
  const tc = await page.getTextContent();
  const its = [];
  for (const i of tc.items){
    if (!i.str || !i.str.trim()) continue;
    its.push({s:i.str, x:i.transform[4], y:i.transform[5], w:i.width, h:Math.abs(i.transform[3])||Math.abs(i.transform[0])||8});
  }
  its.sort((a,b)=> (b.y-a.y) || (a.x-b.x));
  const linhas = [];
  for (const it of its){
    const tol = Math.max(2, it.h*0.45);
    let ln = null;
    for (let k=linhas.length-1; k>=0 && k>=linhas.length-4; k--){ if (Math.abs(linhas[k].y-it.y) <= tol){ ln = linhas[k]; break; } }
    if (!ln){ ln = {y:it.y, its:[]}; linhas.push(ln); }
    ln.its.push(it);
  }
  return linhas.map(ln=>{
    ln.its.sort((a,b)=>a.x-b.x);
    let txt='', fim=null;
    for (const it of ln.its){
      const cw = it.s.length ? it.w/it.s.length : 5;
      if (fim!==null){
        const gap = it.x-fim;
        if (gap > cw*1.6) txt += '   ';
        else if (gap > cw*0.25 && !/\s$/.test(txt) && !/^\s/.test(it.s)) txt += ' ';
      }
      txt += it.s; fim = it.x + it.w;
    }
    return txt.replace(/ /g,' ').replace(/\s+$/,'');
  });
}

async function textoDoPdf(pdf, max){

const numBR = (t)=>{ // "2.677,48" -> 2677.48 ; "1.010" (densidade) -> 1.01 tratado pelo contexto
  if (t==null) return NaN; let s=String(t).trim().replace(/\s/g,'');
  if (!/^[<>≤≥]?[-+]?[\d.,]+$/.test(s)) return NaN;
  s=s.replace(/^[<>≤≥]/,'');
  if (s.includes(',')) s=s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  return parseFloat(s);
};
const limpa = (t)=>String(t||'').replace(/\s+/g,' ').trim();
const tituloCaso = (t)=>{ const m=limpa(t).toLowerCase(); const siglas=/\b(tgo|tgp|ast|alt|tsh|hdl|ldl|vldl|t3|t4|psa|vhs|a1c|hba1c|pcr|ggt|cpk|ck|dhea|fsh|lh|igf|shbg|b12|b9|rdw|vgm|hbgm|chbgm|hcm|chcm|vcm)\b/gi;
  return m.replace(/(^|[\s(\-\/])([a-zà-ú])/g,(a,b,c)=>b+c.toUpperCase()).replace(siglas,s=>s.toUpperCase()).replace(/\bDe\b/g,'de').replace(/\bDa\b/g,'da').replace(/\bDo\b/g,'do').replace(/\bE\b/g,'e').replace(/\bA\b(?!1)/g,'a'); };

// Lê um laudo no formato "um exame por página" com "Resultado:" e tabelas pontilhadas.
// Devolve null quando o texto não tem esse formato (aí o app usa a IA).
function lerLaudoTexto(paginas){
  const todo = paginas.map(p=>p.join('\n')).join('\n');
  if (!/Resultado\s*:/i.test(todo) && !/\.{4,}\s*:/.test(todo)) return null;
  let data='', laboratorio='';
  const md = todo.match(/Data\/Hora Atend\.?\s*:\s*(\d{2})\/(\d{2})\/(\d{4})/i) || todo.match(/Coleta\s*:\s*(\d{2})\/(\d{2})\/(\d{4})/i);
  if (md) data = md[3]+'-'+md[2]+'-'+md[1];
  if (/UNIMED LITORAL/i.test(todo)) laboratorio='Unimed Litoral';
  else { const ml = todo.match(/Laborat[óo]rio\s+(?:de\s+An[áa]lises\s+Cl[íi]nicas\s+)?([A-ZÀ-Ú][\wÀ-ú ]{2,30})/); if (ml) laboratorio=limpa(ml[1]); }

  const itens = [];
  const IGNORA = /^(Material|M[ée]todo|Coleta|Libera[çc][ãa]o|Notas?|Nota no laudo|Observa[çc][ãa]o|Fonte|Exame realizado|Paciente em jejum|Respons[áa]vel|ASSINATURA|Sr \(a\)|Idade|Dr \(a\)|Documento|Local coleta|"A interpreta)/i;

  for (const linhas of paginas){
    // corpo: entre a linha de sublinhados e a assinatura
    let ini = linhas.findIndex(l=>/_{10,}/.test(l)); ini = ini<0?0:ini+1;
    let fim = linhas.findIndex((l,i)=>i>ini && /ASSINATURA DIGITAL|Respons[áa]vel t[ée]cnico/i.test(l)); if (fim<0) fim=linhas.length;
    const corpo = linhas.slice(ini,fim);
    let titulo = '', secao='', colunasPct=false, pularAte=-1;
    const ehUrina = ()=>/URINA/i.test(titulo);
    for (let i=0;i<corpo.length;i++){
      const raw = corpo[i]; const l = raw.trim(); if (!l || i<=pularAte) continue;
      if (/^%\s+por\s+mm3/i.test(l)){ colunasPct=true; continue; }
      // título: linha em maiúsculas que não é cabeçalho de campo
      if (/^[A-ZÀ-Ú0-9][A-ZÀ-Ú0-9 \-–\/().,]{3,}$/.test(l) && !/:/.test(l) && !/[a-zà-ú]/.test(l) && !/^(ERITROGRAMA|LEUCOGRAMA)$/.test(l)){ titulo=l; secao=''; colunasPct=false; continue; }
      if (/^(ERITROGRAMA|LEUCOGRAMA)\b/.test(l)){ secao=l.split(/\s{2,}/)[0]; colunasPct=false; continue; }

      // 1) "Resultado:   valor   unidade   [referência na mesma linha]"
      const mr = l.match(/^Resultado\s*:\s*(.+)$/i);
      if (mr && titulo){
        const cols = mr[1].split(/\s{2,}/).map(limpa).filter(Boolean);
        let valor = cols[0]||'', unidade = '', refInline='';
        const mv = valor.match(/^([<>≤≥]?\s*[\d.,]+)\s*(.*)$/);
        if (mv){ valor=mv[1].replace(/\s/g,''); unidade=mv[2]; }
        let k=1;
        if (!unidade && cols[k] && !/\d+\s*a\s*\d|inferior|superior|n[ãa]o diab/i.test(cols[k])) { unidade=cols[k]; k++; }
        if (cols[k]) refInline = cols.slice(k).join(' ');
        // referência: na mesma linha, ou depois de "Valor de Referência:"
        let refLinhas = [];
        if (refInline) refLinhas.push(refInline);
        let j=i+1;
        for (;j<corpo.length && j<i+16;j++){
          const lj = corpo[j].trim();
          if (!lj){ if (refLinhas.length) break; else continue; }
          if (/^Resultado\s*:/i.test(lj) || /^Resultados anteriores/i.test(lj)) break;
          if (IGNORA.test(lj) && !/^Valor(?:es)? de Refer/i.test(lj)){ if (refLinhas.length) break; else continue; }
          if (/^[A-ZÀ-Ú0-9][A-ZÀ-Ú0-9 \-–\/().,]{3,}$/.test(lj) && !/[a-zà-ú]/.test(lj)) break;
          const mref = lj.match(/^Valor(?:es)? de Refer[êe]ncia\s*:?\s*(.*)$/i);
          if (mref){ if (mref[1]) refLinhas.push(mref[1]); continue; }
          if (refInline || refLinhas.length) refLinhas.push(lj);
        }
        if (refLinhas.length) pularAte = j-1;
        // referência que vem ANTES (coluna à direita da linha de cima, ex.: "Valor de Referência:" acima do resultado)
        if (!refLinhas.length){
          for (let j=i-1;j>=Math.max(0,i-3);j--){ const mm=corpo[j].match(/Valor(?:es)? de Refer[êe]ncia\s*:\s*(.+)$/i); if (mm){ refLinhas.push(mm[1]); break; } }
        }
        const anteriores = lerAnteriores(corpo, i);
        const nome = (/^(ESTIMATIVA DA TAXA DE FILTRA)/i.test(titulo)) ? 'Taxa de filtração glomerular (estimada)' : tituloCaso(titulo.replace(/\s*-\s*(TGO|TGP)\/(AST|ALT)$/i,' ($1/$2)').replace(/\s+DILU[ÍI]DA$/i,''));
        itens.push({nome, valor, unidade:limpa(unidade), referencia:juntarRef(refLinhas).slice(0,320), anteriores, situacao:'sem_referencia'});
        continue;
      }

      // 2) tabelas pontilhadas: "Hemoglobina (g/dL).......:   14,8    13,3 a 16,7 g/dL"
      const mt = raw.match(/^\s*(.+?)\s*\.{3,}\s*([^:]{0,8}?)\s*:\s*(.*)$/);
      if (mt && titulo){
        let nome = limpa(mt[1]); let unidade = limpa(mt[2]);
        const mu = nome.match(/^(.*?)\s*\(([^)]+)\)\s*$/); if (mu){ nome=mu[1]; unidade=unidade||mu[2]; }
        if (/c[ée]lulas contadas/i.test(nome)) continue;
        const cols = mt[3].split(/\s{2,}/).map(limpa).filter(Boolean);
        if (!cols.length) continue;
        const sufixo = ehUrina() ? ' (urina)' : '';
        // leucograma: "%   absoluto   referência do absoluto"
        if (colunasPct && cols.length>=3 && !isNaN(numBR(cols[0])) && !isNaN(numBR(cols[1])) && cols[2]!=='a'){
          itens.push({nome:nome+' (%)'+sufixo, valor:cols[0], unidade:'%', referencia:'', anteriores:[], situacao:'sem_referencia'});
          itens.push({nome:nome+sufixo, valor:cols[1], unidade:unidade||'/mm3', referencia:limpa(cols.slice(2).join(' ')), anteriores:[], situacao:'sem_referencia'});
          continue;
        }
        let valor = cols[0]; let ref = cols.slice(1).join(' ');
        const vu = valor.match(/^([\d.,]+)\s+(\/?\S+)$/); if (vu){ valor=vu[1]; unidade=unidade||vu[2]; }
        if (!unidade){ const ru = ref.match(/^(\/\S+|[a-zµμ%][\w/µμ%]*)\s{1,}(.*)$/i); if (ru && /\/|%|dl|mm3|ml|l$/i.test(ru[1])){ unidade=ru[1]; ref=ru[2]; } }
        if (isNaN(numBR(valor))) unidade='';
        itens.push({nome:nome+sufixo, valor, unidade, referencia:limpa(ref), anteriores:[], situacao:'sem_referencia'});
      }
    }
  }
  if (!itens.length) return null;
  const tipo = /bioimped/i.test(todo) ? 'bioimpedancia' : 'sangue';
  return {tipo, data, laboratorio, itens, observacao:''};
}

// junta as linhas da referência: "- item" ou "Rótulo: valor" começam parte nova; o resto continua a anterior
function juntarRef(linhas){
  const partes=[];
  for (const bruto of linhas){
    const l=limpa(bruto).replace(/\.{3,}\s*:/g,':'); if (!l) continue;
    if (partes.length && /:\s*$/.test(partes[partes.length-1]) && !/^-\s/.test(l)) partes[partes.length-1]+=' '+l;
    else if (!partes.length || /^-\s/.test(l) || /^[^:]{2,70}:/.test(l) || /^\*/.test(l)) partes.push(l.replace(/^-\s*/,''));
    else partes[partes.length-1]+=' '+l;
  }
  return partes.filter(p=>!/^\*/.test(p)).join('; ');
}

function lerAnteriores(corpo, desde){
  const out=[];
  for (let j=desde+1;j<corpo.length;j++){
    const l=corpo[j].trim();
    if (/^Resultado\s*:/i.test(l)) break;
    const m = l.match(/^Resultados anteriores\s*:\s*(.*)$/i);
    const alvo = m ? m[1] : (out.length ? l : null);
    if (alvo==null) continue;
    const mm = alvo.match(/^(\d{2})\/(\d{2})\/(\d{4})\s*-\s*([\d.,]+)/);
    if (mm){ const v=numBR(mm[4]); out.push({data:mm[3]+'-'+mm[2]+'-'+mm[1], valor: isNaN(v)?mm[4]:String(+v.toFixed(2)).replace('.',',')}); }
    else if (out.length) break;
  }
  return out;
}

/* ---------- situação: normal, baixo ou alto, a partir da referência ---------- */
const PALAVRAS_FAIXA_BOA = /(normal|adequad|desej[áa]vel|ideal|n[ãa]o diab|normoglic|com ou sem jejum|com jejum|homens?|masculino|risco card[íi]aco baixo|adultos)/i;
function faixaDe(texto){
  const t = String(texto||'').replace(/(\d)\s*,\s*(\d)/g,'$1,$2');
  let m;
  const N = '([\\d.]+(?:,\\d+)?)';
  if ((m = t.match(new RegExp('(?:de\\s+)?'+N+'\\s*(?:a|-|até)\\s*'+N,'i')))) return {min:numBR(m[1]), max:numBR(m[2])};
  if ((m = t.match(new RegExp('(?:inferior|abaixo|menor)\\s+(?:ou igual\\s+)?(?:a|de)\\s+'+N,'i')))) return {min:-Infinity, max:numBR(m[1])};
  if ((m = t.match(new RegExp('(?:superior|acima|maior)\\s+(?:ou igual\\s+)?(?:a|de)\\s+'+N,'i')))) return {min:numBR(m[1]), max:Infinity};
  if ((m = t.match(new RegExp('^\\s*[<≤]\\s*'+N)))) return {min:-Infinity, max:numBR(m[1])};
  if ((m = t.match(new RegExp('^\\s*[>≥]\\s*'+N)))) return {min:numBR(m[1]), max:Infinity};
  return null;
}
// Tenta classificar sozinho. Devolve 'normal' | 'alto' | 'baixo' | null (ambíguo: deixa para a IA)
function classificar(item, perfil){
  const ref = String(item.referencia||''); if (!ref) return null;
  const v = numBR(item.valor);
  // valores em texto (urina): igual à referência = normal
  if (isNaN(v)){
    const val = limpa(item.valor).toLowerCase(); if (!val) return null;
    const opcoes = ref.toLowerCase().split(/[\/;]|\bou\b/).map(limpa);
    if (opcoes.some(o=>o && (o===val || o.startsWith(val) || val.startsWith(o)))) return 'normal';
    if (/ausente|negativo|normal|n[ãa]o reagente/.test(ref.toLowerCase()) && !/ausente|negativo|normal|discreta|n[ãa]o reagente/.test(val)) return 'alto';
    return null;
  }
  return _classificarFaixa(faixasDaPessoa(ref, perfil), v);
}
function faixasDaPessoa(ref, perfil){
  // "Feminino: 21 a 49 anos: x" vira partes separadas de rótulo e faixa
  const partes = String(ref||'').split(';').map(limpa).filter(Boolean).flatMap(p=>{ const m=p.match(/^(homens?|masculino|mulher(?:es)?|feminino)\s*:\s*(.+)$/i); return (m && /anos/.test(m[2])) ? [m[1]+':', m[2]] : [p]; });
  const sexo = (perfil&&perfil.sexo)||'masculino'; const idade = +((perfil&&perfil.idade)||0);
  let cand = partes;
  // separa por sexo quando a referência traz faixas de homem e mulher
  if (partes.some(p=>/(homens?|masculino|mulher(es)?|feminino)\s*:/i.test(p))){
    const fem = /^f/i.test(sexo); let atual=null; const sel=[];
    for (const p of partes){
      const ms = p.match(/^(homens?|masculino|mulher(?:es)?|feminino)\s*:\s*(.*)$/i);
      if (ms){ atual = /^(mulher|feminino)/i.test(ms[1]) ? 'f':'m'; if (ms[2] && (atual==='f')===fem) sel.push(ms[2]); continue; }
      if (atual && (atual==='f')===fem) sel.push(p);
    }
    if (sel.length) cand = sel;
  }
  // faixas por idade: "21 a 49 anos....: 47,01 a 980,56"
  if (cand.some(p=>/anos/.test(p)) && idade){
    const porIdade = cand.filter(p=>{ const m=p.match(/(\d+)\s*a\s*(\d+)\s*anos/); if(m) return idade>=+m[1]&&idade<=+m[2]; const s=p.match(/(?:superior|maior)[^\d]*(\d+)\s*anos/i); if(s) return idade>=+s[1]; return false; })
      .map(p=>p.replace(/^.*?anos[.\s:]*/,''));
    if (porIdade.length) cand = porIdade;
  }
  return cand;
}
function _classificarFaixa(cand, v){
  let faixa=null;
  if (cand.length===1) faixa = faixaDe(cand[0]);
  else {
    const boa = cand.find(p=>PALAVRAS_FAIXA_BOA.test(p) && faixaDe(p.replace(/^[^:]*:/,'')));
    if (boa) faixa = faixaDe(boa.replace(/^[^:]*:/,''));
  }
  if (!faixa || isNaN(faixa.min)&&isNaN(faixa.max)) return null;
  if (v < faixa.min) return 'baixo';
  if (v > faixa.max) return 'alto';
  return 'normal';
}
// texto da referência só com a parte que vale para a pessoa (sexo e idade), para mostrar na tela
function refDaPessoa(ref, perfil){
  const partes = String(ref||'').split(';').map(limpa).filter(Boolean);
  const cand = faixasDaPessoa(ref, perfil);
  return (cand.length && cand.length < partes.length) ? cand.join('; ') : String(ref||'');
}

/* ---------- bioimpedância no formato do relatório Pratique ----------
   Os números das barras da página 1 vêm como imagem: o leitor devolve esses itens em branco
   (lista "faltando") para a IA ler só essa página, ou para a pessoa digitar na revisão. */
const virgula=(v)=>String(v).replace('.',',');
const BIO_CAMPOS=[ // nome no app, unidade, trecho da descrição no relatório, lido como imagem?
  ['Peso','kg','Massa atual do corpo',false],

function lerBioPratique(paginas){
  const linhas=paginas.flat(); const todo=linhas.join('\n'); const plano=todo.replace(/\s+/g,' ');
  if(!/Composi[çc][ãa]o Corporal/i.test(plano.replace(/(\S) (?=\S )/g,'$1')) && !/A n á l i s e d a C o m p o s i ç ã o/.test(plano)) return null;
  if(!/Padr[ãa]o:\s*[\d.]+/.test(plano) || !/Porcentagem muscular/i.test(plano)) return null;
  const r={tipo:'bioimpedancia',data:'',laboratorio:'Pratique',itens:[],observacao:''};
  let m;
  if((m=plano.match(/Data e Hora\s*[:：]\s*(\d{2})\/(\d{2})\/(\d{4})/))) r.data=m[3]+'-'+m[2]+'-'+m[1];
  const altura=(m=plano.match(/Altura\s*[:：]\s*(\d{2,3})\s*cm/))?+m[1]:0;
  const idade=(m=plano.match(/Idade\s*[:：]\s*(\d{1,3})/))?+m[1]:0;
  // histórico: "10/10/2026   106.8   21.2"
  const hist=[]; const reH=/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2,3}\.\d)\s+(\d{1,2}\.\d)/g;
  while((m=reH.exec(todo))) hist.push({data:m[3]+'-'+m[2]+'-'+m[1],peso:+m[4],gord:+m[5]});
  const atual=hist.find(h=>h.data===r.data)||hist[0];
  const anteriores=(k)=>hist.filter(h=>h!==atual).slice(0,4).map(h=>({data:h.data,valor:virgula(h[k])}));
  // faixas "Padrão:64.8kg~76.1kg"
  const padrao=(trecho)=>{ if(!trecho) return ''; const i=plano.indexOf(trecho); if(i<0) return ''; const mm=plano.slice(i,i+260).match(/Padr[ãa]o:\s*([\d.]+)\s*(kg|%)?\s*~\s*([\d.]+)\s*(kg|%)?/); return mm?virgula(mm[1])+' a '+virgula(mm[3])+(mm[4]||mm[2]?' '+(mm[4]||mm[2]):''):''; };
  const peso=atual?atual.peso:NaN, gord=atual?atual.gord:NaN;
  const pesoGord=peso*gord/100;
  let rcq=(m=plano.match(/Rela[çc][ãa]o Cintura-Quadril\s+(\d\.\d{1,2})\b/))?+m[1]:NaN;
  const calculado={'Peso':peso,'Gordura corporal':gord,'Peso de gordura':+pesoGord.toFixed(1),'Peso magro':+(peso-pesoGord).toFixed(1),'IMC':altura?+(peso/Math.pow(altura/100,2)).toFixed(1):NaN,'Relação cintura-quadril':rcq};
  const faltando=[];
  for(const [nome,un,trecho,img] of BIO_CAMPOS){
    const v=calculado[nome]; const it={nome:nome+(un==='%'?' (%)':''),valor:(v!=null&&!isNaN(v))?virgula(v):'',unidade:un==='%'?'%':un,referencia:padrao(trecho),situacao:'sem_referencia'};
    if(nome==='Peso') it.anteriores=anteriores('peso');
    if(nome==='Gordura corporal') it.anteriores=anteriores('gord');
    if(!it.valor) faltando.push(it.nome);
    r.itens.push(it);
  }
  // placar do topo: "58   44   Sobrepeso" + "Leve"
  const ix=linhas.findIndex(l=>/^\s*\d{1,3}\s{2,}\d{1,3}\s{2,}[A-Za-zÀ-ú]/.test(l));
  if(ix>=0){
    const p=linhas[ix].trim().split(/\s{2,}/); let classe=p.slice(2).join(' ');
    if(linhas[ix+1] && /^[A-Za-zÀ-ú]+$/.test(linhas[ix+1].trim())) classe+=' '+linhas[ix+1].trim();
    r.itens.push({nome:'Pontuação de saúde',valor:p[0],unidade:'de 100',referencia:'',situacao:'sem_referencia'});
    r.itens.push({nome:'Idade corporal',valor:p[1],unidade:'anos',referencia:idade?'idade real: '+idade+' anos':'',situacao:idade?(+p[1]>idade?'alto':'normal'):'sem_referencia'});
    if(classe) r.itens.push({nome:'Classificação corporal',valor:classe,unidade:'',referencia:'',situacao:/normal/i.test(classe)?'normal':'alto'});
  }
  // peso ideal e ajustes sugeridos: "Peso   102.4   -4.4   -6.6" ... "+2.2"
  if((m=plano.match(/Peso\s+(\d{2,3}\.\d)\s+([-+]\d+\.\d)\s+([-+]\d+\.\d)/))){
    r.itens.push({nome:'Peso ideal',valor:virgula(m[1]),unidade:'kg',referencia:'',situacao:'sem_referencia'});
    r.itens.push({nome:'Ajuste sugerido de peso',valor:virgula(m[2]),unidade:'kg',referencia:'',situacao:'sem_referencia'});
    r.itens.push({nome:'Ajuste sugerido de gordura',valor:virgula(m[3]),unidade:'kg',referencia:'',situacao:'sem_referencia'});
    const mm=plano.match(/Padr[ãa]o:\s*[\d.]+kg~[\d.]+kg\s+kg\s+([-+]\d+\.\d)/); if(mm) r.itens.push({nome:'Ajuste sugerido de massa muscular',valor:virgula(mm[1]),unidade:'kg',referencia:'',situacao:'sem_referencia'});
  }
  if((m=plano.match(/Ingest[ãa]o Di[áa]ria de Calorias\s*[:：]\s*(\d+)\s*kcal/))) r.itens.push({nome:'Ingestão diária de calorias sugerida',valor:m[1],unidade:'kcal',referencia:'',situacao:'sem_referencia'});
  if((m=plano.match(/Aer[óo]bicos\s*[:：]\s*(\d+)\s*kcal/))) r.itens.push({nome:'Gasto sugerido com aeróbicos',valor:m[1],unidade:'kcal',referencia:'',situacao:'sem_referencia'});
  // análise segmentar: ordem no relatório = braço esq., braço dir., perna esq., perna dir.
  const lados=['braço esquerdo','braço direito','perna esquerda','perna direita'];
  const seg=(rot)=>{ const out=[]; const re=new RegExp(rot+':\\s*([\\d.]+)\\s*kg\\s+([\\d.]+)%','g'); let x; while((x=re.exec(plano))) out.push([x[1],x[2]]); return out; };
  const mus=seg('Muscul'), gor=seg('Gordura');
  mus.slice(0,4).forEach((v,k)=>r.itens.push({nome:'Músculo '+lados[k],valor:virgula(v[0]),unidade:'kg',referencia:virgula(v[1])+'% do padrão',situacao:'sem_referencia'}));
  gor.slice(0,4).forEach((v,k)=>r.itens.push({nome:'Gordura '+lados[k],valor:virgula(v[0]),unidade:'kg',referencia:virgula(v[1])+'% do padrão',situacao:'sem_referencia'}));
  if((m=plano.match(/Gordura do Tronco:\s*M[úu]sculos do Tronco:[\s\S]{0,140}?([\d.]+)\s*kg\s+([\d.]+)%\s*[↑↓]?\s*([\d.]+)\s*kg\s+([\d.]+)%/))){
    r.itens.push({nome:'Gordura do tronco',valor:virgula(m[1]),unidade:'kg',referencia:virgula(m[2])+'% do padrão',situacao:'sem_referencia'});
    r.itens.push({nome:'Músculo do tronco',valor:virgula(m[3]),unidade:'kg',referencia:virgula(m[4])+'% do padrão',situacao:'sem_referencia'});
  }
  // medidas
  for(const [rot,nome] of [['Circunferência do Braço','Circunferência do braço'],['Circunferência da Cintura','Circunferência da cintura'],['Circunferência dos Quadris','Circunferência do quadril'],['Dimensão da Coxa','Circunferência da coxa'],['Largura dos Ombros','Largura dos ombros']]){
    const mm=plano.match(new RegExp(rot+'\\s+([\\d.]+)\\s*cm')); if(mm) r.itens.push({nome,valor:virgula(mm[1]),unidade:'cm',referencia:'',situacao:'sem_referencia'});
  }
  // postura: "Risco de ...：NÍVEL", nível e medida podem vir quebrados em linhas
  r.itens.push(...lerPostura(linhas));
  r.itens.forEach(i=>{ if(i.situacao==='sem_referencia'&&i.valor&&/\d\s*a\s*\d/.test(i.referencia)){ const c=classificarBio(i); if(c) i.situacao=c; } });
  return {resposta:r,faltando};
}

// nesses itens, ficar abaixo da faixa é bom
const MENOR_MELHOR=/^(Relação cintura-quadril|Gordura visceral)/;
function classificarBio(i){ const c=classificar(i,{}); return (c==='baixo'&&MENOR_MELHOR.test(i.nome))?'normal':c; }

function lerPostura(linhas){
  const cel=[]; for(const l of linhas) for(const c of l.split(/\s{3,}/)) if(c.trim()) cel.push(c.trim());
  const NIVEL=/^(?:(?:MUITO|Muito)\s+)?(?:ALTO|Alto|Baixo|BAIXO|M[ée]dio|MÉDIO|Moderado)$|^(?:MUITO|Muito)$/;
  const out=[];
  for(let k=0;k<cel.length;k++){
    if(!/^Risco de\b/.test(cel[k])) continue;
    let nome=cel[k].replace(/^Risco de\s*/,''), nivel='', medidas=[], fechou=false;
    // medidas que aparecem logo antes (ex.: "Perna esquerda", "5.4°")
    for(let j=Math.max(0,k-2);j<k;j++){ const mm=cel[j].match(/^(?:Perna (?:esquerda|direita)\s*)?([\d.]+)\s*(°|cm)$/); if(mm) medidas.push(virgula(mm[1])+(mm[2]==="cm"?" cm":mm[2])); }
    for(let j=k+1;j<Math.min(cel.length,k+14)&&!(fechou&&nivel&&!/^MUITO$/.test(nivel));j++){
      const c=cel[j];
      if(/^Risco de\b/.test(c)) break;
      const mm=c.match(/^(?:Perna (?:esquerda|direita)\s*)?([\d.]+)\s*(°|cm)$/); if(mm){ medidas.push(virgula(mm[1])+(mm[2]==="cm"?" cm":mm[2])); continue; }
      const mc=c.match(/^([^：:]{0,30})[：:]\s*(.*)$/);
      if(!fechou && mc && c.length<40){ nome+=' '+mc[1]; nivel=mc[2]; fechou=true; continue; }
      if(!fechou && c.length<=22 && !/\d/.test(c) && /^[A-Za-zÀ-ú\/ ]+$/.test(c) && /^[a-zà-ú]/.test(c)){ nome+=' '+c; continue; }
      if(fechou && NIVEL.test(c)){ nivel=(nivel?nivel+' ':'')+c; }
    }
    nivel=limpa(nivel); if(!nivel) continue;
    const alto=/alto/i.test(nivel);
    out.push({nome:'Postura: '+limpa(nome).replace(/\s+/g,' '),valor:medidas.slice(0,2).join(' / ')||'—',unidade:'',referencia:'Risco '+nivel.toLowerCase(),situacao:alto?'alto':'normal'});
  }
  return out;
}

// pede à IA só os números das barras (vêm como imagem na página 1)
function promptBarrasPratique(faltando){
  return `A imagem é a página 1 de um relatório de bioimpedância. Na coluna "Análise da Composição Corporal" e no quadro "Análise do Grau de Obesidade", cada item tem uma barra com o valor escrito no fim dela (ex.: "46.0%", "7.0", "2197.3kcal").
Leia SOMENTE estes valores: ${faltando.join(', ')}.
Mapeamento dos rótulos: "Massa muscular (%)" = Músculo; "Água corporal (%)" = ÁGUA; "Gordura visceral" = VIS-Gordura; "Gordura subcutânea (%)" = SUB-Gordura; "Proteína (%)" = Proteína; "Massa óssea" = OSSO; "Massa muscular esquelética" = Peso Muscular; "Taxa metabólica basal" = TMB.
Responda SOMENTE com JSON, número com ponto decimal e sem unidade, por exemplo {"Massa muscular (%)": 46.0, "Taxa metabólica basal": 2197.3}. Se não conseguir ler um valor, deixe-o de fora.`;
}
function aplicarBarras(resposta,lidos){
  const ok=[];
  for(const it of resposta.itens){
    if(it.valor || !(it.nome in (lidos||{}))) continue;
    const v=+String(lidos[it.nome]).replace(',','.'); if(!isFinite(v)) continue;
    const f=faixaDe(it.referencia); if(f&&isFinite(f.min)&&isFinite(f.max)&&(v<f.min*0.3||v>f.max*3)) continue; // valor absurdo: descarta
    it.valor=virgula(v); const c=classificarBio(it); if(c) it.situacao=c; ok.push(it.nome);
  }
  return ok;
}

const MAX_PAGINAS = 40;   // páginas lidas como imagem (laudo escaneado ou foto)
const LOTE = 4;           // páginas enviadas à IA por chamada, no modo imagem
const LOTE_TEXTO = 6;     // páginas de texto por chamada, para laudos de outros laboratórios

const normNome = (t)=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%]+/g,' ').trim();
const limparItem = (i)=>{ const o={nome:String(i.nome||'').trim(),valor:String(i.valor??'').trim(),unidade:String(i.unidade||'').trim(),referencia:String(i.referencia||'').trim(),situacao:String(i.situacao||'sem_referencia')};
  if(Array.isArray(i.anteriores)&&i.anteriores.length) o.anteriores=i.anteriores.slice(0,4).map(a=>({data:String(a.data||''),valor:String(a.valor??'')})); return o; };

// nomes mais curtos para exames conhecidos
const APELIDOS=[[/^Transaminase Glut[âa]mico Oxalac[ée]tica/i,'TGO (AST)'],[/^Transaminase Glut[âa]mico Pir[úu]vica/i,'TGP (ALT)'],[/^TSH\b/i,'TSH'],[/^Hemoglobina Glicada/i,'Hemoglobina glicada (A1C)'],[/^Velocidade de Hemossedimenta/i,'VHS (hemossedimentação)'],[/^Zinco S[ée]rico/i,'Zinco'],[/^Colesterol HDL/i,'Colesterol HDL'],[/^Colesterol LDL/i,'Colesterol LDL']];
const apelido=(n)=>{ for(const [re,novo] of APELIDOS){ if(re.test(n)) return novo; } return n; };

function promptLaudo(origem, tipoInf, dataInf){

${origem}
${tipoInf?'Tipo informado: '+tipoInf+'.':''} ${dataInf?'Data informada: '+dataInf+'.':''}
Responda SOMENTE com JSON:

Copie valores e referências exatamente como estão. Inclua TODOS os resultados, um por item: no hemograma, cada linha (hemácias, hemoglobina, leucócitos, plaquetas etc.); na urina, cada parâmetro com "(urina)" no nome. Para bioimpedância, inclua peso, % de gordura, massa muscular, gordura visceral, água e taxa metabólica quando houver. Não invente itens que não aparecem. Páginas sem resultados (capa, instruções, assinatura) geram "itens":[].`;
