async function abrirPdf(f){
  const lib=window.pdfjsLib; if(!lib) throw {code:'pdf'};
  try{ lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; return await lib.getDocument({data:await f.arrayBuffer()}).promise; }
  catch(e){ throw {code:'pdf'}; }
}
async function renderPagina(p){
  if(p.blob) return p.blob;
  try{
    const pg=await p.pdf.getPage(p.n); const vp=pg.getViewport({scale:1.8});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)); c.width=c.height=0; return b;
  }catch(e){ throw {code:'pdf'}; }
}
const temTexto=(paginas)=>{ const chars=paginas.reduce((n,p)=>n+p.join('').replace(/\s/g,'').length,0); return chars >= 150*Math.max(1,paginas.length)*0.5; };

// chama a IA aguardando uma vez se bater o limite por minuto
async function iaComPausa(prompt,opts,status,msg){
  try{ return await ia.json(prompt,opts); }
  catch(e){ if(e&&e.code==='rate_limited'){ status('Limite por minuto da IA atingido. Aguardando 30 segundos para continuar…'); await espera(30000); status(msg); return await ia.json(prompt,opts); } throw e; }
}
const FATAIS=['sem_chave','chave','offline','cancelled','rate_limited','modelo'];

// lê em lotes (texto ou imagem), juntando o que der certo e anotando o que falhar
async function lerEmLotes(lotes,montar,status,rotulo){
  const respostas=[], falhas=[]; let erroFatal=null;
  for(let k=0;k<lotes.length;k++){
    const faixa=lotes[k].faixa; const msg=lotes.length===1?'Lendo os valores do laudo. Isso leva alguns segundos.':'Lendo '+faixa+' de '+rotulo+'…';
    status(msg);
    try{ const {prompt,opts}=await montar(lotes[k]); const r=await iaComPausa(prompt,Object.assign({onStatus:status},opts),status,msg); if(r&&Array.isArray(r.itens)) respostas.push(r); else falhas.push(faixa); }
    catch(e){ if(FATAIS.includes(e&&e.code)){ erroFatal=e; falhas.push(faixa+' em diante'); break; } falhas.push(faixa); }
  }
  return {respostas,falhas,erroFatal};
}
const faixaTxt=(ini,fim)=>ini===fim?'página '+ini:'páginas '+ini+' a '+fim;

// classifica pela IA só o que a regra não resolveu; se a IA falhar, fica "sem referência"
async function classificarAmbiguos(itens,status){
  const amb=itens.map((i,ix)=>({i,ix})).filter(o=>o.i.situacao==='sem_referencia'&&o.i.referencia&&String(o.i.valor).trim());
  if(!amb.length||!iaPronta()) return;
  status('Conferindo '+amb.length+' valor'+(amb.length>1?'es':'')+' com referência por faixa…');
  const p=S.perfil||{};
  const prompt=`Classifique cada resultado de exame comparando com a referência do próprio laudo, para uma pessoa do sexo ${p.sexo||'não informado'} com ${p.idade||'idade não informada'} anos.
Quando a referência tiver várias faixas (por sexo, idade ou risco), use a faixa da pessoa; para risco cardíaco não informado, use o risco baixo.
Responda SOMENTE com JSON no formato {"0":"normal","3":"alto"} usando os números abaixo e um destes valores: normal, alto, baixo, sem_referencia.
${amb.map((o,n)=>n+') '+o.i.nome+': '+o.i.valor+' '+o.i.unidade+' | referência: '+o.i.referencia).join('\n')}`;
  try{ const r=await ia.json(prompt,{onStatus:status}); amb.forEach((o,n)=>{ const v=String(r&&r[n]||'').toLowerCase(); if(['normal','alto','baixo'].includes(v)) itens[o.ix].situacao=v; }); }
  catch(e){ /* sem IA: fica como está */ }
}

async function lerExame(files, texto, tipoInf, dataInf){
  S.busy={tipo:'exame',txt:'Lendo o laudo…'};S.erro=null;render();
  const status=(t)=>{S.busy={tipo:'exame',txt:t};render();};
  try{
    // texto digitado: uma chamada só
    if(!files||!files.length){
      if(!iaPronta()) throw {code:'sem_chave'};
      const r=await ia.json(promptLaudo('Texto digitado pela pessoa:\n"""\n'+texto+'\n"""',tipoInf,dataInf),{onStatus:status});
      if(!r||!Array.isArray(r.itens)) throw {code:'invalid_json'};
      abrirRevisao([r],tipoInf,dataInf,[]); return;
    }
    status('Abrindo o laudo…');
    const respostas=[], avisos=[], falhas=[], imagens=[]; let erroFatal=null, totalImg=0, usouLeitorProprio=false;
    for(const f of files){
      if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){ totalImg++; if(imagens.length<MAX_PAGINAS) imagens.push({blob:f}); continue; }
      const pdf=await abrirPdf(f);
      status('Lendo o texto do PDF…');
      let paginas=[]; try{ paginas=await textoDoPdf(pdf,80); }catch(e){ paginas=[]; }
      if(paginas.length && temTexto(paginas)){
        // 0) bioimpedância Pratique: texto direto; os números das barras (imagem) a IA lê só na página 1
        const bio=lerBioPratique(paginas);
        if(bio){
          if(bio.faltando.length && iaPronta()){
            status('Lendo os números das barras do relatório…');
            try{ const img=await renderPagina({pdf,n:1}); const lidos=await ia.json(promptBarrasPratique(bio.faltando),{images:[img],onStatus:status}); const ok=aplicarBarras(bio.resposta,lidos); bio.faltando=bio.faltando.filter(n=>!ok.includes(n)); }
            catch(e){ /* sem IA: a pessoa preenche na revisão */ }
          }
          if(bio.faltando.length) avisos.push(bio.faltando.length+' valor'+(bio.faltando.length>1?'es estão':' está')+' só como imagem no relatório ('+bio.faltando.join(', ')+'). Preencha os campos em branco olhando as barras da página 1; os que ficarem vazios não são salvos.');
          respostas.push(bio.resposta); continue;
        }
        // 1) formato conhecido: lê sem IA
        const proprio=lerLaudoTexto(paginas);
        if(proprio&&proprio.itens.length>=3){
          const perfil=S.perfil||{};
          proprio.itens.forEach(i=>{ i.nome=apelido(i.nome); const c=classificar(i,perfil); if(c) i.situacao=c; });
          respostas.push(proprio); usouLeitorProprio=true; continue;
        }
        // 2) outro laboratório com texto: manda o texto para a IA (mais rápido e preciso que imagem)
        if(!iaPronta()) throw {code:'sem_chave'};
        const lotes=[]; for(let i=0;i<paginas.length;i+=LOTE_TEXTO){ const fim=Math.min(paginas.length,i+LOTE_TEXTO); lotes.push({ini:i+1,fim,faixa:faixaTxt(i+1,fim),txt:paginas.slice(i,fim).map((p,k)=>'--- página '+(i+k+1)+' ---\n'+p.join('\n')).join('\n').slice(0,24000)}); }
        const r=await lerEmLotes(lotes,async(l)=>({prompt:promptLaudo('Texto extraído das '+l.faixa+' de um laudo com '+paginas.length+' páginas (colunas separadas por espaços):\n"""\n'+l.txt+'\n"""',tipoInf,dataInf),opts:{}}),status,paginas.length+' páginas');
        respostas.push(...r.respostas); falhas.push(...r.falhas); if(r.erroFatal) erroFatal=r.erroFatal;
        continue;
      }
      // 3) PDF escaneado: vira imagem
      for(let i=1;i<=pdf.numPages;i++){ totalImg++; if(imagens.length<MAX_PAGINAS) imagens.push({pdf,n:i}); }
    }
    if(imagens.length){
      if(!iaPronta()) throw {code:'sem_chave'};
      const lotes=[]; for(let i=0;i<imagens.length;i+=LOTE){ const fim=Math.min(imagens.length,i+LOTE); lotes.push({faixa:faixaTxt(i+1,fim),pags:imagens.slice(i,fim),n:imagens.length}); }
      const r=await lerEmLotes(lotes,async(l)=>{ const imgs=[]; for(const p of l.pags) imgs.push(await renderPagina(p)); return {prompt:promptLaudo('As imagens anexas são as '+l.faixa+' de um laudo com '+l.n+' páginas.',tipoInf,dataInf),opts:{images:imgs}}; },status,imagens.length+' páginas');
      respostas.push(...r.respostas); falhas.push(...r.falhas); if(r.erroFatal) erroFatal=r.erroFatal;
      if(totalImg>imagens.length) avisos.push('O laudo tem '+totalImg+' páginas em imagem. Li as '+imagens.length+' primeiras; envie o resto como outro exame.');
    }
    if(!respostas.some(r=>r.itens.length)) throw erroFatal||{code:'invalid_json'};
    if(falhas.length) avisos.push('Não consegui ler: '+falhas.join(', ')+'. Confira esses valores no laudo e use "Digitar os valores" se faltar algo.');
    const rasc=montarRascunho(respostas,tipoInf,dataInf,avisos);
    if(usouLeitorProprio) await classificarAmbiguos(rasc.itens,status);
    mostrarRevisao(rasc);
  }catch(e){S.busy=null;S.erro=(e&&e.code==='pdf')?'Não consegui abrir esse PDF. Tente tirar uma foto das páginas.':erroIA(e);render();}
}

function montarRascunho(respostas,tipoInf,dataInf,avisos){
  const pega=(campo)=>{for(const r of respostas){if(r[campo])return String(r[campo]);}return '';};
  const vistos=new Set(), itens=[];
  for(const r of respostas) for(const bruto of (r.itens||[])){
    const i=limparItem(bruto); if(!i.nome) continue;
    const chave=normNome(i.nome)+'|'+i.valor; if(vistos.has(chave)) continue; vistos.add(chave); itens.push(i);
  }
  const obs=respostas.map(r=>r.observacao).filter(Boolean).slice(0,2).join(' ');
  return {id:uidGen(),tipo:pega('tipo')||tipoInf||'outro',data:pega('data')||dataInf||hoje(),laboratorio:pega('laboratorio'),observacao:obs,itens,avisos};
}
function mostrarRevisao(rasc){ S.dup=null; S.rascunho=rasc; S.busy=null; S.sub='revisar'; render(); window.scrollTo(0,0); }
function abrirRevisao(respostas,tipoInf,dataInf,avisos){ mostrarRevisao(montarRascunho(respostas,tipoInf,dataInf,avisos)); }

    const prop=validarAlteracao(r&&r.alterar);
    if(prop) alvo.proposta=prop;
    else if(r&&r.alterar) alvo.content+='\n\n(Não consegui montar a mudança no formato do plano. Peça de novo, de forma mais específica.)';
    alvo.pend=false;
  }catch(e){
    if(e&&e.code==='invalid_json'&&e.text){ alvo.content=String(e.text).replace(/```[\s\S]*?```/g,'').trim()||erroIA(e); }
    else { const m=erroIA(e); alvo.content=m||'Pergunta cancelada.'; }
    alvo.pend=false;
  }
  chatCtl=null; render(); const fim=document.getElementById('ultima'); if(fim) fim.scrollIntoView({block:'nearest'});
}

// confere se a mudança proposta tem o formato do plano antes de oferecer o botão
function validarAlteracao(alt){
  if(!alt||!S.plano) return null;
  const secao=alt.secao==='treino'||(!alt.secao&&alt.treino)?'treino':'dieta';
  const novo=alt[secao]; if(!novo||typeof novo!=='object') return null;
  if(secao==='dieta'){ if(!Array.isArray(novo.refeicoes)||!novo.refeicoes.length||!isFinite(+novo.calorias)) return null; }
  else { if(!Array.isArray(novo.dias)||!novo.dias.length||novo.dias.some(d=>!d||!d.id||!Array.isArray(d.exercicios))) return null; }
  return {secao, novo, resumo:String(alt.resumo||'').slice(0,240), mudou:resumoMudancas(secao,S.plano[secao],novo), estado:'pendente'};
}
function resumoMudancas(secao,antigo,novo){
  const out=[]; antigo=antigo||{};
  if(secao==='dieta'){
    for(const k of [['calorias','kcal'],['proteina_g','g de proteína']]) if(+antigo[k[0]]!==+novo[k[0]]) out.push(num(antigo[k[0]])+' → '+num(novo[k[0]])+' '+k[1]);
    const mapa=new Map((antigo.refeicoes||[]).map(r=>[normNome(r.nome),r]));
    for(const r of novo.refeicoes){ const a=mapa.get(normNome(r.nome)); if(!a) out.push(r.nome+' (nova)'); else if(JSON.stringify(a.itens)!==JSON.stringify(r.itens)||JSON.stringify(a.trocas||[])!==JSON.stringify(r.trocas||[])) out.push(r.nome); }
  } else {
    const mapa=new Map((antigo.dias||[]).map(d=>[d.id,d]));
    for(const d of novo.dias){ const a=mapa.get(d.id); if(!a) out.push('Treino '+d.id+' (novo)'); else if(JSON.stringify(a.exercicios)!==JSON.stringify(d.exercicios)||a.titulo!==d.titulo) out.push('Treino '+d.id); }
  }
  return out;
}
async function aplicarProposta(ix,desfazer){
  const m=S.chat[ix]; if(!m||!m.proposta||!S.plano) return;
  const p=m.proposta;
  if(desfazer){ if(!p.anterior) return; S.plano[p.secao]=p.anterior; p.estado='desfeita'; }
  else { p.anterior=JSON.parse(JSON.stringify(S.plano[p.secao]||null)); S.plano[p.secao]=p.novo; p.estado='aplicada'; }
  S.plano.editado=hoje(); if(p.secao==='treino'){ S.dia=null; S.feitos={}; lsSet('feitos',{}); }
  await save('plano',S.plano);
  toast(desfazer?'Mudança desfeita.':(p.secao==='dieta'?'Plano alimentar atualizado.':'Treino atualizado.')); render();
}

function anel(feitos,total,tam){
  tam=tam||84; const r=(tam-10)/2, c=2*Math.PI*r, p=total?Math.min(1,feitos/total):0;
  return `<div class="anel" style="width:${tam}px;height:${tam}px" role="img" aria-label="${feitos} de ${total} treinos nesta semana"><svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg><span>${feitos}/${total}<small>semana</small></span></div>`;
}

function semana(){
  const d=new Date(); const dow=(d.getDay()+6)%7; const seg=new Date(d); seg.setDate(d.getDate()-dow);
  const feitos=new Set((S.registro.treinos||[]).map(t=>t.data));
  const nomes=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']; let c=0;
  const cells=nomes.map((n,i)=>{const x=new Date(seg);x.setDate(seg.getDate()+i);const iso=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
    const ok=feitos.has(iso); if(ok)c++; const t=i===dow;
    return `<div><span${t?' style="color:var(--fg);font-weight:700"':''}>${t?'Hoje':n}</span><span class="dot${ok?' done':''}${t&&!ok?' today':''}" role="img" aria-label="${n}: ${ok?'treino feito':'sem treino registrado'}">${ok?ICON.check.replace(/20/g,'16'):''}</span></div>`;}).join('');
  return {cells,c};
}
function proximoDia(){
  const dias=S.plano.treino.dias; const n=(S.registro.treinos||[]).length; return dias[n%dias.length];
}

function telaInicio(){
  const p=S.perfil; const nome=(p.nome||'').split(' ')[0];
  const dataTxt=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  let o=`<div class="row between"><div class="stack-s" style="gap:2px"><span class="small muted" style="font-weight:600">${h(dataTxt.charAt(0).toUpperCase()+dataTxt.slice(1))}</span><h1>Olá, ${h(nome)}</h1></div><button class="iconbtn" data-act="perfil" aria-label="Abrir seu perfil" style="overflow:hidden;padding:0">${S.foto?`<img src="${S.foto}" alt="" class="avatar-img">`:ICON.user}</button></div>`;
  o+=statusBox();
  if(!iaPronta()) o+=`<button class="alert warn" style="border:0;font:inherit;text-align:left;cursor:pointer;width:100%" data-act="config">${ICON.warn}<span class="stack-s" style="gap:2px;flex:1"><strong>Configure a IA</strong><span class="small">Sem ela o app não lê exames nem monta o plano.</span></span>${ICON.arrow}</button>`;
  if(!S.plano){
    o+=`<div class="hero"><span class="eyebrow" style="color:var(--accent-ink)">Próximo passo</span><h2>Monte seu plano de treino e alimentação</h2><p class="sub">${S.exames.length?`${S.exames.length} exame${S.exames.length>1?'s':''} cadastrado${S.exames.length>1?'s':''}. O avaliador vai usar tudo isso.`:'Dá para gerar só com o perfil, mas com bioimpedância e exame de sangue o plano fica mais preciso.'}</p>
      <div class="grid2"><button class="btn light" data-act="gerar"${S.busy?' disabled':''}>Gerar plano</button><button class="btn ghost" data-tab="exames">Adicionar exame</button></div></div>`;
    o+=cartaoRelogio();
    return o;
  }
  const pl=S.plano; const prox=proximoDia(); const w=semana(); const recado=recadoRecuperacao();
  o+=`<div class="hero"><div class="row between" style="align-items:flex-start;gap:14px"><div class="stack-s" style="gap:6px;min-width:0"><span class="eyebrow" style="color:var(--accent-ink)">Próximo treino</span><span class="grande">Treino ${h(prox.id)}</span><span style="font-weight:700;font-size:16px">${h(prox.titulo)}</span><span class="sub">${(prox.exercicios||[]).length} exercícios · ~${h(prox.duracao_min||S.perfil.minutos)} min</span></div>${anel(w.c,pl.treino.dias.length)}</div>${recado?`<p class="status warn small row" style="align-items:flex-start">${ICON.warn}<span>${h(recado)}</span></p>`:''}<button class="btn block" data-act="abrirTreino" data-dia="${h(prox.id)}">Começar treino</button></div>`;
  o+=`<div class="grid2"><button class="tile" style="text-align:left;cursor:pointer;font:inherit;color:inherit" data-tab="dieta"><span class="small muted" style="font-weight:600">Calorias do dia</span><span class="num">${num(pl.dieta.calorias)} <small>kcal</small></span></button><button class="tile" style="text-align:left;cursor:pointer;font:inherit;color:inherit" data-tab="dieta"><span class="small muted" style="font-weight:600">Proteína</span><span class="num">${num(pl.dieta.proteina_g)} <small>g</small></span></button></div>`;
  const al=(pl.alertas||[]);
  if(al.length) o+=`<button class="alert warn" style="border:0;font:inherit;text-align:left;cursor:pointer;width:100%" data-act="analise">${ICON.warn}<span class="stack-s" style="gap:2px;flex:1;min-width:0"><strong>${al.length} ponto${al.length>1?'s':''} de atenção</strong><span class="small">${h(al.slice(0,2).map(a=>a.titulo).join(' e '))}</span></span>${ICON.arrow}</button>`;
  else o+=`<button class="alert ok" style="border:0;font:inherit;text-align:left;cursor:pointer;width:100%" data-act="analise">${ICON.check}<span style="flex:1"><strong>Ver análise completa</strong></span>${ICON.arrow}</button>`;
  o+=cartaoRelogio();
  o+=`<div class="card stack"><div class="row between"><h3>Esta semana</h3><span class="small muted">${w.c} de ${pl.treino.dias.length} treinos</span></div><div class="week">${w.cells}</div></div>`;
  o+=`<button class="card row" style="font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%" data-act="chat">${ICON.chat}<span class="stack-s" style="gap:2px;flex:1"><strong>Pergunte ao instrutor</strong><span class="small muted">Troca de exercício, substituição de alimento, dúvidas do plano</span></span>${ICON.arrow}</button>`;
  return o;
}

function telaAnalise(){
  const pl=S.plano; const m=pl.metas||{};
  let o=header('Análise e plano',true);
  o+=`<div class="dark"><span class="eyebrow">Resumo do avaliador</span><p style="font-size:16px;line-height:1.5">${h(pl.resumo)}</p></div>`;

  if((pl.alertas||[]).length) o+=`<div class="stack-s"><h3 class="muted">Pontos de atenção</h3>${pl.alertas.map(a=>`<div class="alert ${a.nivel==='medico'?'bad':'warn'}">${ICON.warn}<span class="stack-s" style="gap:2px"><strong>${h(a.titulo)}</strong><span class="small">${h(a.texto)}</span></span></div>`).join('')}</div>`;
  if((pl.medico||[]).length) o+=`<div class="card stack-s"><h3>Para conversar com o médico</h3><ul style="margin:0;padding-left:18px">${pl.medico.map(x=>`<li>${h(x)}</li>`).join('')}</ul></div>`;

  o+=`<p class="note">Plano gerado em ${fmtData(pl.criado)}. Orientação geral com base nos seus dados; não substitui a avaliação de médico ou nutricionista.</p>`;
  return statusBox()+o;
}

const GRUPOS=[
  {id:'sangue',nome:'Exames de sangue',curto:'Sangue'},
  {id:'bioimpedancia',nome:'Bioimpedância',curto:'Bioimpedância'},
  {id:'avaliacao',nome:'Avaliação física',curto:'Avaliação'},
  {id:'outro',nome:'Outros exames',curto:'Outros'}
];
const grupoDe=(e)=>GRUPOS.some(g=>g.id===e.tipo)?e.tipo:'outro';

const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mesAno=(iso)=>{const p=String(iso||'').split('-');return p.length>=2?MES[+p[1]-1]+'/'+p[0].slice(2):h(iso);};
const antes=(i)=>Array.isArray(i.anteriores)&&i.anteriores.length?`<span class="small" style="color:var(--faint)">Antes: ${i.anteriores.slice(0,3).map(a=>h(a.valor)+' ('+mesAno(a.data)+')').join(' · ')}</span>`:'';
const refCurta=(r)=>{ r=String(r||''); return r.length>90?r.slice(0,88).replace(/[;,\s]+\S*$/,'')+'…':r; };

function cartaoExame(e,maisRecente){
  const alt=(e.itens||[]).filter(i=>i.situacao==='alto'||i.situacao==='baixo').length;
  return `<div class="card stack-s" style="padding:14px 16px">
    <div class="row between" style="align-items:flex-start"><div class="stack-s" style="gap:2px;min-width:0"><h3>${fmtData(e.data)}${maisRecente?' <span class="pill info" style="margin-left:4px;vertical-align:1px">Mais recente</span>':''}</h3>${e.laboratorio?`<span class="small muted">${h(e.laboratorio)}</span>`:''}</div>${alt?`<span class="pill warn">${alt} fora da faixa</span>`:'<span class="pill ok">Tudo na faixa</span>'}</div>
    ${e.observacao?`<p class="small muted">${h(e.observacao)}</p>`:''}
    <details${S.confirmDel===e.id?' open':''}><summary class="row between" style="cursor:pointer;list-style:none;min-height:44px"><span class="small" style="font-weight:700;color:var(--accent-ink)">Ver ${(e.itens||[]).length} valores</span>${ICON.arrow}</summary>
    <div class="list" style="background:var(--surface-2)">${(e.itens||[]).map(i=>`<div class="li"><span class="txt"><strong style="font-size:15px">${h(i.nome)}</strong><span class="small muted">${h(i.valor)} ${h(i.unidade)}${i.referencia?' · ref. '+h(refCurta(refDaPessoa(i.referencia,S.perfil))):''}</span>${antes(i)}</span>${situ(i.situacao)}</div>`).join('')}
    <div class="li">${S.confirmDel===e.id?`<span class="small">Apagar este exame?</span><span class="row"><button class="btn plain" style="min-height:44px" data-act="cancelDel">Não</button><button class="btn danger" style="min-height:44px" data-act="delExame" data-id="${h(e.id)}">Apagar</button></span>`:`<span></span><button class="btn plain" style="min-height:44px" data-act="askDel" data-id="${h(e.id)}">Apagar exame</button>`}</div></div>
    </details></div>`;
}

function telaExames(){
  let o=`<div class="stack-s" style="gap:2px"><h1>Exames</h1><span class="small muted">Bioimpedância, sangue e avaliação física</span></div>`;
  o+=statusBox();
  const podeImg=true;
  o+=`<div class="card stack"><h3>Adicionar exame</h3>
    ${podeImg?`<label class="btn block" for="fArq" style="cursor:pointer">${ICON.up}Foto ou PDF do laudo</label><input id="fArq" class="sr" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple>
    <p class="note">Até ${MAX_PAGINAS} páginas por laudo, em PDF ou várias fotos de uma vez. Pode tirar a foto na hora: o celular oferece a câmera ao escolher o arquivo.</p>`:`<p class="small muted">Este aparelho não envia imagens para a IA. Digite ou cole os valores do laudo.</p>`}
    <button class="btn ghost block" data-act="digitar"${S.busy?' disabled':''}>Digitar os valores</button></div>`;
  if(!S.exames.length){o+=`<div class="card stack-s"><h3>Nenhum exame ainda</h3><p class="small muted">Comece pela bioimpedância mais recente e pelo último exame de sangue. O avaliador compara os valores com as referências do próprio laudo.</p></div>`;return o;}
  const grupos=GRUPOS.map(g=>({...g,lista:S.exames.filter(e=>grupoDe(e)===g.id).sort((x,y)=>String(y.data).localeCompare(String(x.data)))})).filter(g=>g.lista.length);
  const filtro=grupos.some(g=>g.id===S.filtroEx)?S.filtroEx:'todos';
  if(grupos.length>1) o+=`<div class="chips" role="group" aria-label="Filtrar exames"><button class="chip" aria-pressed="${filtro==='todos'}" data-act="filtroEx" data-g="todos">Todos · ${S.exames.length}</button>${grupos.map(g=>`<button class="chip" aria-pressed="${filtro===g.id}" data-act="filtroEx" data-g="${g.id}">${h(g.curto)} · ${g.lista.length}</button>`).join('')}</div>`;
  o+=grupos.filter(g=>filtro==='todos'||g.id===filtro).map(g=>`<section class="stack" aria-labelledby="g-${g.id}">
    <div class="row between" style="align-items:baseline"><h2 id="g-${g.id}">${h(g.nome)}</h2><span class="small muted">${g.lista.length} exame${g.lista.length>1?'s':''}</span></div>
    ${g.lista.map((e,ix)=>cartaoExame(e,ix===0&&g.lista.length>1)).join('')}
  </section>`).join('');
  if(S.plano) o+=`<p class="note">Adicionou exame novo? Gere o plano de novo em Início › Ver análise para que ele entre na conta.</p>`;
  return o;
}

function telaDigitar(){

  <div class="grid2"><label class="f">Tipo<select id="dTipo">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}">${t}</option>`).join('')}</select></label>

  <label class="f">Valores<textarea id="dTexto" style="min-height:180px" placeholder="Um por linha, do jeito que está no laudo. Ex.:&#10;Glicose 102 mg/dL (70 a 99)&#10;Vitamina D 19 ng/mL&#10;Gordura corporal 22,8%"></textarea></label>
  <button class="btn block" type="submit"${S.busy?' disabled':''}>Organizar valores</button></form>`;

function painelRepetido(){
  const d=S.dup; const x=S.exames.find(e=>e.id===d.id); if(!x) return '';
  const det=[];
  if(d.diferentes) det.push(d.diferentes+' com valor diferente');
  if(d.soNovo) det.push(d.soNovo+' só no novo');
  if(d.soAtual) det.push(d.soAtual+' só no atual');
  return `<div id="painelDup" class="card stack" role="alertdialog" aria-labelledby="dupTit" aria-describedby="dupTxt" style="border-color:var(--warn-ink)">
    <div class="row" style="align-items:flex-start;color:var(--warn-ink)">${ICON.warn}<h3 id="dupTit" style="color:var(--fg)">Já existe ${h((TIPOS[x.tipo]||'exame').toLowerCase())} de ${fmtData(x.data)}</h3></div>
    <p id="dupTxt" class="small muted">O salvo tem ${(x.itens||[]).length} valores e o novo tem ${S.rascunho.itens.length}. ${det.length?'Comparando: '+det.join(', ')+'.':'Os valores são iguais.'}</p>
    ${d.lista.length?`<div class="list">${d.lista.slice(0,6).map(i=>`<div class="li"><span class="txt"><strong style="font-size:14px">${h(i.nome)}</strong><span class="small muted">Atual: ${h(i.atual||'—')} · Novo: ${h(i.novo||'—')}</span></span></div>`).join('')}${d.lista.length>6?`<div class="li"><span class="small muted">e mais ${d.lista.length-6}</span></div>`:''}</div>`:''}
    <div class="grid2"><button type="button" class="btn plain" data-act="dupManter">Manter o atual</button><button type="button" class="btn" data-act="dupSubstituir">Substituir</button></div>
    <button type="button" class="btn plain block" data-act="dupVoltar">Voltar e revisar</button>
  </div>`;
}

function telaRevisar(){
  const r=S.rascunho;
  return header('Confira os valores',true)+`${(r.avisos||[]).map(a=>`<div class="alert warn">${ICON.warn}<span class="small">${h(a)}</span></div>`).join('')}
  <p class="muted">${r.itens.length} valores encontrados. Compare com o laudo, corrija o que estiver errado e apague o que não for exame.</p>

    <div class="list">${r.itens.map((i,ix)=>`<div class="li" style="flex-wrap:wrap"><span class="txt" style="flex:1 1 140px"><strong>${h(i.nome)}</strong><span class="small muted">${i.referencia?'ref. '+h(refCurta(refDaPessoa(i.referencia,S.perfil))):'sem referência'}</span>${antes(i)}</span>
      <span class="row" style="flex:0 1 auto;margin-left:auto"><label class="sr" for="rv${ix}">Valor de ${h(i.nome)}</label><input id="rv${ix}" data-ix="${ix}" class="rv" value="${h(i.valor)}" style="flex:0 0 108px;min-width:0;text-align:right;font-variant-numeric:tabular-nums"><span class="small muted" style="min-width:44px">${h(i.unidade)}</span><button type="button" class="iconbtn" data-act="rmItem" data-ix="${ix}" aria-label="Remover ${h(i.nome)}">×</button></span></div>`).join('')||'<div class="li"><span class="small muted">Nenhum valor encontrado.</span></div>'}</div>
    ${S.dup?painelRepetido():`<div class="grid2"><button type="button" class="btn plain" data-act="voltar">Descartar</button><button class="btn" type="submit"${r.itens.length?'':' disabled'}>Salvar exame</button></div>`}

function telaTreino(){
  if(!S.plano) return `<h1>Treino</h1>${semPlano()}`;
  const t=S.plano.treino; if(!S.dia) S.dia=proximoDia().id;
  const d=t.dias.find(x=>x.id===S.dia)||t.dias[0];

  let o=`<div class="stack-s" style="gap:2px"><h1>Treino</h1><span class="small muted" style="font-weight:600">Divisão ${h(t.divisao||t.dias.map(x=>x.id).join(''))}${t.semanas?' · '+h(t.semanas)+' semanas':''}</span></div>`;
  o+=`<div class="tabs" role="group" aria-label="Escolher treino">${t.dias.map(x=>`<button class="chip" aria-pressed="${x.id===d.id}" data-act="dia" data-dia="${h(x.id)}" aria-label="Treino ${h(x.id)}: ${h(x.titulo)}">${h(x.id)}</button>`).join('')}</div>`;
  o+=`<div class="row between" style="align-items:flex-end"><div class="stack-s" style="gap:2px"><h2>Treino ${h(d.id)} · ${h(d.titulo)}</h2><span class="small muted">${ex.length} exercícios · cerca de ${h(d.duracao_min||'')} min</span></div><span class="small" style="font-weight:700;color:var(--accent-ink);white-space:nowrap">${feitos} de ${ex.length}</span></div>`;

  const jaHoje=(S.registro.treinos||[]).some(x=>x.data===hoje());

  if(t.cardio) o+=`<div class="card stack-s"><h3>Aeróbico</h3><p class="small">${h(t.cardio)}</p></div>`;
  if(!t.dias.some(x=>(x.exercicios||[]).some(e=>e.alternativas&&e.alternativas.length))) o+=`<button class="btn ghost block" data-act="pedirAlternativas"${iaPronta()?'':' disabled'}>Pedir alternativas para cada exercício</button>`;

  o+=`<button class="btn plain block" data-act="pedirMudancaTreino"${iaPronta()?'':' disabled'}>Pedir mudança no treino ao instrutor</button>`;
  o+=`<p class="note">Sentiu dor articular ou tontura, pare o exercício. O instrutor propõe a troca e você aplica no treino com um toque.</p>`;
  return o;
}

function telaDieta(){

function exMelhor(texto,db){
  const q=exTokens(texto); if(!q.size) return null; let melhor=null,pts=0;
  const equip=['dumbbell','barbell','cable','machine'].filter(x=>q.has(x));
  for(const e of db){
    const n=e._t||(e._t=exTokens(e.name)); let i=0; for(const w of q) if(n.has(w)) i++;
    if(!i) continue; let sc=2*i/(q.size+n.size);
    if(equip.length&&equip.includes(String(e.equipment||'').split(' ')[0])) sc+=.08;
    for(const v of ['incline','decline']) if(n.has(v)&&!q.has(v)) sc-=.3; // não trocar supino reto por inclinado/declinado
    if(sc>pts||(sc===pts&&melhor&&e.name.length<melhor.name.length)){ pts=sc; melhor=e; }
  }
  return pts>=.45?melhor:null;
}

// ===== Evolução das cargas =====
function pontosCarga(ss){ return (ss||[]).map(x=>({d:x.d,max:Math.max(0,...x.s.map(y=>y.kg||0)),vol:x.s.reduce((t,y)=>t+(y.kg||0)*(y.r||0),0)})).filter(p=>p.max>0).sort((a,b)=>a.d<b.d?-1:1).slice(-12); }
function resumoEvolucao(pts){
  if(!pts.length) return null;
  const pri=pts[0], ult=pts[pts.length-1], rec=pts.reduce((m,p)=>p.max>m.max?p:m,pts[0]), dif=Math.round((ult.max-pri.max)*100)/100;
  const pct=pri.max?Math.round((ult.max-pri.max)/pri.max*1000)/10:null;
  return {pri,ult,rec,dif,pct,n:pts.length};
}
const sinal=(v)=>(v>0?'+':v<0?'−':'')+kgTxt(Math.abs(v));
function textoEvolucao(r){
  if(!r) return '';
  if(r.n<2) return 'Primeiro registro: '+kgTxt(r.ult.max)+' kg. Anote nos próximos treinos para ver a evolução.';
  return 'De '+kgTxt(r.pri.max)+' para '+kgTxt(r.ult.max)+' kg ('+sinal(r.dif)+' kg'+(r.pct!=null?', '+(r.pct>0?'+':r.pct<0?'−':'')+kgTxt(Math.abs(r.pct))+'%':'')+') em '+r.n+' treinos · recorde '+kgTxt(r.rec.max)+' kg ('+dataCurta(r.rec.d)+')';
}
function graficoCarga(pts,w,hh){
  w=w||300; hh=hh||110; if(pts.length<2) return '';
  const L=14,R=14,T=22,B=20, vs=pts.map(p=>p.max); let mn=Math.min(...vs), mx=Math.max(...vs); if(mx===mn){ mn-=1; mx+=1; }
  const X=(i)=>L+(w-L-R)*i/(pts.length-1), Y=(v)=>T+(hh-T-B)*(1-(v-mn)/(mx-mn));
  const linha=pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.max).toFixed(1)).join(' ');
  const ult=pts.length-1, rec=pts.reduce((m,p,i)=>p.max>=pts[m].max?i:m,0);
  const rot=(i,anc)=>`<text x="${X(i).toFixed(1)}" y="${(Y(pts[i].max)-8).toFixed(1)}" text-anchor="${anc}" font-size="11" font-weight="700" style="fill:var(--fg)">${kgTxt(pts[i].max)}</text>`;
  const r=resumoEvolucao(pts);
  return `<svg viewBox="0 0 ${w} ${hh}" width="100%" role="img" aria-label="Evolução da carga: ${h(textoEvolucao(r))}" style="display:block;overflow:visible"><polyline points="${linha}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent)"/>${pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.max).toFixed(1)}" r="${i===rec?5:3.5}" style="fill:${i===rec?'var(--accent-ink)':'var(--accent)'}"/>`).join('')}${rot(0,'start')}${ult!==0?rot(ult,'end'):''}<text x="${L}" y="${hh-4}" font-size="10" style="fill:var(--muted)">${dataCurta(pts[0].d)}</text><text x="${w-R}" y="${hh-4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${dataCurta(pts[ult].d)}</text></svg>`;
}
function evolucaoHtml(ss){
  const pts=pontosCarga(ss); if(!pts.length) return '';
  return `<div class="stack-s" style="gap:6px"><span class="small muted" style="font-weight:600">Evolução (maior carga de cada treino)</span>${graficoCarga(pts)}<span class="small">${h(textoEvolucao(resumoEvolucao(pts)))}</span></div>`;
}
function telaEvolucao(){
  const vistos=new Set(), itens=[];
  for(const d of ((S.plano&&S.plano.treino&&S.plano.treino.dias)||[])) (d.exercicios||[]).forEach((e,i)=>{ const c=chaveCarga(e); if(vistos.has(c)) return; vistos.add(c); const pts=pontosCarga(sessoesCarga(e)); if(pts.length) itens.push({e,k:d.id+i,pts,r:resumoEvolucao(pts)}); });
  let o=header('Evolução das cargas',true);

  const subiu=itens.filter(x=>x.r.n>1&&x.r.dif>0).length;
  o+=`<p class="small muted">${itens.length} exercícios com carga anotada${subiu?' · '+subiu+(subiu===1?' subiu':' subiram')+' desde o primeiro registro':''}.</p>`;

  return o;
}

async function prepararFoto(file){
  if(!file||!/^image\//.test(file.type||'')) throw new Error('tipo');
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,err)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>err(new Error('img')); i.src=url; });
    const L=256, c=document.createElement('canvas'); c.width=L; c.height=L;
    const w=img.naturalWidth, a=img.naturalHeight, q=Math.min(w,a); if(!q) throw new Error('vazia');
    c.getContext('2d').drawImage(img,(w-q)/2,(a-q)/2,q,q,0,0,L,L);
    return c.toDataURL('image/jpeg',.82);
  } finally { URL.revokeObjectURL(url); }
}

function compararExames(atual,novo){
  const mapa=(lista)=>{const m=new Map();for(const i of (lista||[])){const k=normNome(i.nome);if(k&&!m.has(k))m.set(k,i);}return m;};
  const A=mapa(atual.itens), N=mapa(novo.itens); const lista=[]; let diferentes=0, soNovo=0, soAtual=0;
  const fmt=(i)=>i?(String(i.valor)+(i.unidade?' '+i.unidade:'')):'';
  for(const [k,i] of N){ const a=A.get(k); if(!a){soNovo++; lista.push({nome:i.nome,atual:'',novo:fmt(i)});} else if(String(a.valor).replace(',','.').trim()!==String(i.valor).replace(',','.').trim()){diferentes++; lista.push({nome:i.nome,atual:fmt(a),novo:fmt(i)});} }
  for(const [k,a] of A){ if(!N.has(k)){soAtual++; lista.push({nome:a.nome,atual:fmt(a),novo:''});} }
  return {id:atual.id, diferentes, soNovo, soAtual, lista};
}

  S.exames=[r].concat(base).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
  await save('exames',S.exames); S.rascunho=null; S.dup=null; S.sub=null; S.tab='exames';
  let extra='';
  if(r.tipo==='bioimpedancia'&&S.perfil){
    const ip=r.itens.find(i=>/^Peso$/i.test(i.nome)); const v=ip?numBR(ip.valor):NaN;
    const maisNova=!S.exames.some(e=>e!==r&&e.tipo==='bioimpedancia'&&String(e.data)>String(r.data));
    if(isFinite(v)&&maisNova&&String(S.perfil.peso)!==String(v)){ S.perfil.peso=String(v); await save('perfil',S.perfil); extra=' Peso do perfil atualizado para '+virgula(v)+' kg.'; }
  }
  toast((substituirId?'Exame substituído.':'Exame salvo.')+extra); render(); window.scrollTo(0,0);
}

function syncRev(){document.querySelectorAll('.rv').forEach(i=>{const r=S.rascunho.itens[+i.dataset.ix];if(r)r.valor=i.value;});const tp=document.getElementById('rTipo'),dt=document.getElementById('rData');if(tp)S.rascunho.tipo=tp.value;if(dt)S.rascunho.data=dt.value;}

function lerCfgForm(){
  const c=S.cfg=normCfg(S.cfg); const k=document.getElementById('cChave'),m=document.getElementById('cModelo');
  if(k){ const v=k.value.trim(); if(v) c.chaves[c.provedor]=v; else delete c.chaves[c.provedor]; }
  if(m) c.modelos[c.provedor]=m.value.trim();
  for(const t in TAREFAS){ const el=document.getElementById('t_'+t); if(el) c.tarefas[t]=el.value; }
  const r=document.getElementById('cReserva'); if(r) c.reserva=r.checked;
  normCfg(c);
}

document.addEventListener('submit', async (ev)=>{
  ev.preventDefault(); const f=ev.target;
  if(f.id==='fSenha'){
    const v=document.getElementById('sSenha').value; S.erro=null;
    if(S.lock==='criar'){
      const v2=document.getElementById('sSenha2').value; const em=(document.getElementById('sEmail').value||'').trim();
      S.emailRasc=em;
      if(v.length<4){S.erro='A senha precisa ter pelo menos 4 caracteres.';render();return;}
      if(v!==v2){S.erro='As duas senhas não são iguais.';render();return;}
      if(em&&!emailValido(em)){S.erro='O e-mail parece incompleto. Corrija ou deixe em branco.';render();return;}
      S.busy={txt:'Protegendo seus dados…'};render();
      const dados={}; for(const k of CHAVES){ const x=rawGet(k); if(x!==null) dados[k]=x; }
      try{ S.novoCodigo=await criarCofre(v,dados,em); }catch(e){ S.busy=null; S.erro='Não consegui criar a senha neste aparelho. Libere espaço e tente de novo.'; render(); return; }
      S.busy=null; S.guardei=false; S.lock='codigo'; render(); window.scrollTo(0,0); return;
    }
    if(!v){render();return;}
    S.busy={txt:'Abrindo…'};render();
    let ok=false; try{ ok=await abrirCofre(v,false); }catch(e){ ok=false; }
    S.busy=null;
    if(!ok){ falhouTentativa('Senha incorreta.'); return; }
    rawDel('tentativas'); S.lock=null; S.erro=null; await carregarDados(); return;
  }
  if(f.id==='fRecuperar'){
    const cod=document.getElementById('rCodigo').value, n1=document.getElementById('rNova').value, n2=document.getElementById('rNova2').value;
    S.erro=null;
    if(normCodigo(cod).length!==20){S.erro='O código tem 20 letras e números. Confira e digite de novo.';render();return;}
    if(n1.length<4){S.erro='A nova senha precisa ter pelo menos 4 caracteres.';render();return;}
    if(n1!==n2){S.erro='As duas senhas novas não são iguais.';render();return;}
    S.busy={txt:'Conferindo o código…'};render();
    let ok=false; try{ ok=await abrirCofre(cod,true); }catch(e){ ok=false; }
    if(!ok){ S.busy=null; falhouTentativa('Código incorreto.'); return; }
    try{ await novaSenha(n1); }catch(e){ S.busy=null; S.erro='Não consegui salvar a nova senha. Tente de novo.'; render(); return; }
    rawDel('tentativas'); S.busy=null; S.lock=null; S.erro=null; await carregarDados(); toast('Senha nova criada. O código de recuperação continua o mesmo.'); return;
  }
  if(f.id==='fTroca'){
    const at=document.getElementById('tAtual').value, n1=document.getElementById('tNova').value, n2=document.getElementById('tNova2').value;
    S.erro=null;
    if(n1.length<4){S.erro='A nova senha precisa ter pelo menos 4 caracteres.';render();return;}
    if(n1!==n2){S.erro='As duas senhas novas não são iguais.';render();return;}
    S.busy={txt:'Trocando a senha…'};render();
    let ok=false; try{ await desembrulhar(at,rawGet('cofre').senha); ok=true; }catch(e){}
    if(!ok){S.busy=null;S.erro='A senha atual está incorreta.';render();return;}
    try{ await novaSenha(n1); }catch(e){ S.busy=null; S.erro='Não consegui trocar a senha. Tente de novo.'; render(); return; }
    S.busy=null; S.sub=null; S.editPerfil=true; toast('Senha trocada.'); render(); window.scrollTo(0,0); return;
  }
  if(f.id==='fCfg'){
    lerCfgForm(); if(!iaPronta()){document.getElementById('cChave').focus();toast('Cole a chave de API.');return;}
    lsSet('cfg',S.cfg); const primeiro=!S.cfgVisto; S.cfgVisto=true; lsSet('cfgVisto',true); S.editCfg=false; S.erro=null;
    toast(primeiro?'Tudo pronto. Agora é só adicionar exames ou gerar o plano.':'Configuração salva.'); S.tab='inicio'; S.sub=null; render(); window.scrollTo(0,0); return;
  }
  if(f.id==='fPerfil'){
    const g=(id)=>document.getElementById(id).value.trim();
    if(!g('pNome')){document.getElementById('pNome').focus();toast('Preencha como quer ser chamado.');return;}
    const novo=!S.perfil;
    S.perfil={nome:g('pNome'),sexo:g('pSexo'),idade:g('pIdade'),altura:g('pAltura'),peso:g('pPeso'),objetivo:g('pObj'),nivel:g('pNivel'),local:g('pLocal'),dias:g('pDias'),minutos:g('pMin'),lesoes:g('pLesoes'),alimentacao:g('pAlim')};
    S.editPerfil=false; await save('perfil',S.perfil); if(!novo) toast('Perfil salvo.'); S.tab='inicio'; S.sub=null; render(); window.scrollTo(0,0);
  }
  else if(f.id==='fDig'){
    const tx=document.getElementById('dTexto').value.trim(); if(!tx){toast('Digite pelo menos um valor.');return;}
    lerExame(null,tx.slice(0,20000),document.getElementById('dTipo').value,document.getElementById('dData').value);
  }
  else if(f.id==='fRev'){
    syncRev(); const r=S.rascunho; r.itens=r.itens.filter(i=>i.nome&&String(i.valor).trim());
    const dup=S.exames.find(e=>e.id!==r.id&&e.tipo===r.tipo&&String(e.data)===String(r.data));
    if(dup){ S.dup=compararExames(dup,r); render(); const pn=document.getElementById('painelDup'); if(pn){ pn.scrollIntoView({behavior:'smooth',block:'center'}); const b=pn.querySelector('[data-act=dupManter]'); if(b) b.focus({preventScroll:true}); } return; }
    await salvarRascunho(null);
  }
  else if(f.id==='fChat'){
    const el=document.getElementById('cMsg'); const q=el.value.trim(); if(!q||S.chat.some(m=>m.pend))return; perguntar(q.slice(0,2000));
  }
});
document.addEventListener('change',(ev)=>{
  if(ev.target.classList.contains('mostrar')){ const f=ev.target.closest('form'); f.querySelectorAll('input[type=password],input[data-pw]').forEach(i=>{i.dataset.pw='1';i.type=ev.target.checked?'text':'password';}); return; }
  if((ev.target.id==='rTipo'||ev.target.id==='rData')&&S.dup){ syncRev(); S.dup=null; render(); return; }
  if(ev.target.id==='cGuardei'){ S.guardei=ev.target.checked; const b=document.querySelector('[data-act=codigoOk]'); if(b) b.disabled=!S.guardei; return; }
  if(ev.target.id==='fArq'&&ev.target.files&&ev.target.files.length){ const fs=Array.from(ev.target.files); ev.target.value=''; lerExame(fs); }
  if(ev.target.id==='fImp'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value='';
    f.text().then(async tx=>{
      let d; try{d=JSON.parse(tx);}catch(e){toast('Esse arquivo não é uma cópia do app.');return;}
      if(!d||d.app!=='treino-nutricao'){toast('Esse arquivo não é uma cópia do app.');return;}
      S.perfil=d.perfil||S.perfil; S.exames=Array.isArray(d.exames)?d.exames:[]; S.plano=d.plano||null; S.registro=d.registro&&d.registro.treinos?d.registro:{treinos:[]}; S.foto=(typeof d.foto==='string'&&d.foto.startsWith('data:image/'))?d.foto:null;
      await save('perfil',S.perfil); await save('exames',S.exames); await save('plano',S.plano); await save('registro',S.registro); await save('foto',S.foto);
      S.editPerfil=false; S.tab='inicio'; toast('Cópia restaurada.'); render();
    });
  }
});

/* ---------- início ---------- */
function falhouTentativa(msg){
  const t=(rawGet('tentativas')||0)+1; try{rawSet('tentativas',t);}catch(e){}
  if(t>=5){ S.bloqAte=Date.now()+30000*Math.pow(2,Math.min(t-5,5)); tickBloqueio(); }
  S.erro=msg+(t>=5?' Muitas tentativas: espere para tentar de novo.':''); render();
}
function tickBloqueio(){ const t=setInterval(()=>{ if(!S.lock||Date.now()>=(S.bloqAte||0)){clearInterval(t);} if((S.lock==='entrar'||S.lock==='recuperar')&&!S.busy){ const ids=['sSenha','rCodigo','rNova','rNova2']; const vals=ids.map(i=>{const e=document.getElementById(i);return e?e.value:null;}); render(); ids.forEach((i,n)=>{const e=document.getElementById(i);if(e&&vals[n]!=null)e.value=vals[n];}); } },1000); }

// ===== Digital (WebAuthn + PRF): a chave mestra ganha uma terceira trava, que só abre com a digital do aparelho.
// O segredo sai do próprio sensor (não fica guardado no app), então a criptografia não fica mais fraca que a senha. =====
const BIO_SALT=new TextEncoder().encode('treino-nutricao-bio-v1');
const VERSAO_APP=22;
function bioMotivo(){
  if(!window.isSecureContext) return 'o app não está num endereço seguro (https).';
  if(!window.PublicKeyCredential) return NATIVO?'o app Android não oferece, dentro dele, o recurso de digital do navegador.':'este navegador não oferece o recurso de digital.';
  return '';
}
const bioDisponivel=()=>!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext);
const bioAtiva=()=>{ const c=rawGet('cofre'); return !!(c&&c.bio&&c.bio.id); };
async function bioChave(seg){
  const base=await crypto.subtle.importKey('raw',seg,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:new TextEncoder().encode('tn-bio-v1')},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function bioSegredo(idBytes){ // pede a digital e devolve o segredo do sensor
  const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rpId:location.hostname,allowCredentials:[{type:'public-key',id:idBytes,transports:['internal']}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:BIO_SALT}}}}});
  const ext=r&&r.getClientExtensionResults?r.getClientExtensionResults():null; const out=ext&&ext.prf&&ext.prf.results&&ext.prf.results.first;
  if(!out) throw new Error('sem-prf'); return new Uint8Array(out);
}
async function ativarBio(){
  if(!COFRE.mestra) throw new Error('fechado');
  const cred=await navigator.credentials.create({publicKey:{rp:{name:'Treino e Nutrição',id:location.hostname},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'treino-nutricao',displayName:'Treino e Nutrição'},challenge:crypto.getRandomValues(new Uint8Array(32)),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000,extensions:{prf:{}}}});
  const id=new Uint8Array(cred.rawId);
  const chave=await bioChave(await bioSegredo(id)); // 2ª leitura da digital: gera o segredo que trava a chave mestra
  const c=rawGet('cofre'); c.bio={id:b64(id),pac:await cifrarBytes(chave,COFRE.mestra)}; rawSet('cofre',c); // só grava se tudo deu certo
}
async function entrarComDigital(){
  const c=rawGet('cofre'); if(!c||!c.bio) return false;
  const chave=await bioChave(await bioSegredo(unb64(c.bio.id)));
  await carregarCache(await decifrarBytes(chave,c.bio.pac)); return true;
}
async function tentarDigital(silencioso){
  if(S.busy||S.lock!=='entrar') return;
  try{ if(await entrarComDigital()){ rawDel('tentativas'); S.lock=null; S.erro=null; await carregarDados(); } }
  catch(e){ if(!silencioso){ S.erro=(e&&e.name==='NotAllowedError')?'Digital não confirmada. Tente de novo ou digite a senha.':'Não consegui usar a digital agora. Digite a senha.'; render(); } }
}
const autoDigital=()=>{ if(S.lock==='entrar'&&bioAtiva()&&bioDisponivel()) setTimeout(()=>tentarDigital(true),450); };

function bloquear(){
  if(!COFRE.key) return;
  fecharCofre(); if(chatCtl) chatCtl.abort();
  Object.assign(S,{perfil:null,foto:null,exames:[],plano:null,registro:{treinos:[]},feitos:{},cfg:null,saude:null,chat:[],rascunho:null,busy:null,erro:null,sub:null,editPerfil:false,editCfg:false,ready:false,lock:'entrar',tab:'inicio',novoCodigo:null});
  window.scrollTo(0,0); render();
}

async function carregarDados(){
  const [perfil,exames,plano,registro]=await Promise.all([load('perfil',null),load('exames',[]),load('plano',null),load('registro',{treinos:[]})]);
  S.perfil=perfil; S.exames=Array.isArray(exames)?exames:[]; S.plano=plano; S.registro=registro&&registro.treinos?registro:{treinos:[]};
  S.foto=lsGet('foto')||null; S.feitos=lsGet('feitos')||{}; S.cfg=normCfg(lsGet('cfg')); S.cfgVisto=!!lsGet('cfgVisto')||iaPronta();
  if(!S.cfg) S.cfg={provedor:'gemini',chave:'',modelo:''};
  S.saude=lsGet('saude');
  S.ready=true; render(); window.scrollTo(0,0);
  // no app Android, atualiza o relógio sozinho se já foi autorizado e faz mais de 2 horas
  if(NATIVO&&S.saude&&(Date.now()-new Date(S.saude.sincronizado).getTime()>((S.saude.pendentes||[]).length?15*60e3:2*3600e3))) sincronizarSaude(false);
}

// bloqueio automático: 15 minutos em segundo plano
const BLOQ_MS=15*60*1000; let saiuEm=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ saiuEm=Date.now(); }
  else if(saiuEm&&COFRE.key&&Date.now()-saiuEm>=BLOQ_MS){ saiuEm=null; COFRE.fila.then(()=>{ bloquear(); autoDigital(); }); }
  else saiuEm=null;
});

async function boot(){
  if('serviceWorker' in navigator && location.protocol==='https:'){
    if(NATIVO){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}); }
    else navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  if(!temCripto()){ S.lock='semCripto'; render(); return; }
  if(rawGet('cofre')){
    S.lock='entrar';
    const t=rawGet('tentativas')||0; if(t>=5){ S.bloqAte=Date.now()+30000; tickBloqueio(); }
  } else {
    S.migrar=CHAVES.some(k=>rawGet(k)!==null); S.lock='criar';
  }
  render(); setTimeout(()=>{const i=document.getElementById('sSenha');if(i)i.focus();},50); autoDigital();
}
boot();
})();
