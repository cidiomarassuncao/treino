<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treino e Nutrição</title>
<meta name="theme-color" content="#0A0C10">
<meta name="description" content="Treino e alimentação montados por IA a partir dos seus exames.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%;color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Visual escuro esportivo, só um tema: grafite com viés azul, um azul elétrico de destaque,
   títulos largos e números condensados de placar. Cartões só onde há um objeto separado. */
:root{
  --bg:#0A0C10; --surface:#13171D; --surface-2:#1A1F27; --line:#252C36; --fg:#EDF1F7; --muted:#98A2B3; --faint:#5E6878;
  --accent:#3D9BFF; --accent-strong:#6BB4FF; --on-accent:#03101F; --accent-soft:rgba(61,155,255,.15); --accent-ink:#8CC4FF; --accent-line:rgba(61,155,255,.45);
  --hero:#1A1F27; --on-hero:#EDF1F7; --hero-muted:#98A2B3;
  --warn-soft:#2E2312; --warn-ink:#FFC266; --bad-soft:#331718; --bad-ink:#FF8A8A; --info-soft:#221D38; --info-ink:#C2B5FF;
  --carb:#B49CFF; --fat:#FFC266;
  --display:'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-card:20px; --r-ctl:14px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
::selection{background:var(--accent);color:var(--on-accent)}
#app{max-width:540px;margin:0 auto;padding-inline:16px;padding-block:20px calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
#app.entra{animation:entra .28s cubic-bezier(.2,.7,.2,1)}
@keyframes entra{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em}
h2{font-family:var(--display);font-stretch:108%;font-weight:750;font-size:20px;line-height:1.2;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent-ink)}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-family:var(--display);font-stretch:112%;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px} .stack-s{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px}
.hero{position:relative;overflow:hidden;background:var(--surface-2);color:var(--fg);border:1px solid var(--accent-line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero::before{content:"";position:absolute;inset:auto -30% 55% auto;width:240px;height:240px;border-radius:50%;background:radial-gradient(closest-side,rgba(61,155,255,.22),transparent);pointer-events:none}
.hero > *{position:relative}
.hero .sub{color:var(--muted);font-size:14px}
.hero .grande{font-family:var(--display);font-stretch:75%;font-weight:850;font-size:44px;line-height:.95;letter-spacing:-.01em;text-transform:uppercase}
.dark{background:var(--surface-2);color:var(--on-hero);border:1px solid var(--line);border-radius:var(--r-card);padding:20px;display:flex;flex-direction:column;gap:8px}
.dark .eyebrow{color:var(--accent-ink)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
button.tile:active{transform:scale(.98)}
.tile .num,.num{font-family:var(--display);font-stretch:75%;font-weight:800;font-size:32px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile .num small{font-family:var(--body);font-stretch:100%;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;border:1.5px solid transparent;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--on-accent);transition:transform .12s ease,background-color .15s ease}
.btn:hover{background:var(--accent-strong)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border-color:var(--accent-line);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.light{background:var(--accent);color:var(--on-accent)}
.btn.plain{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.plain:hover{background:var(--surface-2)}
.btn.danger{background:transparent;border-color:var(--bad-ink);color:var(--bad-ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:var(--accent-soft);color:var(--accent-ink)} .warn{background:var(--warn-soft);color:var(--warn-ink)} .bad{background:var(--bad-soft);color:var(--bad-ink)} .info{background:var(--info-soft);color:var(--info-ink)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:0 16px}
.list > .li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list > .li:last-child{border-bottom:0}
.li .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.alert{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 14px;min-height:48px;width:100%;transition:border-color .15s ease,box-shadow .15s ease}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{accent-color:var(--accent)}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.tabs .chip{font-family:var(--display);font-stretch:75%;font-size:22px;font-weight:800;min-height:52px;border-radius:16px}
.ex{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.ex .exn{flex:none;width:34px;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:22px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.ex.feito .exn{color:var(--accent)}
.ex.feito .txt strong{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.ex .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.check{width:44px;height:44px;flex:none;border-radius:50%;border:1.5px solid var(--faint);background:transparent;color:var(--on-accent);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:transform .12s ease}
.check:active{transform:scale(.9)}
.check[aria-pressed="true"]{border-color:var(--accent);background:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.dot{width:34px;height:34px;margin:6px auto 0;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px dashed var(--faint)}
.dot.done{background:var(--accent);color:var(--on-accent);border:0}
.dot.today{border:2px solid var(--accent)}
.anel{flex:none;display:grid;place-items:center;position:relative}
.anel span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-stretch:75%;font-weight:800;font-size:22px;line-height:1}
.anel small{font-family:var(--body);font-stretch:100%;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.macro{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:3px}
.macro i{display:block;height:100%;border-radius:999px}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.leg b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.meal{display:flex;flex-direction:column;gap:6px}
.meal ul{margin:0;padding-left:18px;color:var(--muted)}
.meal li::marker{color:var(--accent)}
details summary::-webkit-details-marker{display:none}
.bubble{padding:12px 14px;border-radius:20px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.bubble.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
.status{padding:12px 14px;border-radius:16px;font-size:14px}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s} #app.entra{animation:none} .btn,.check{transition:none}}
.table-wrap{overflow-x:auto}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(13,16,21,.86);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.bottom .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.bottom button{background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;cursor:pointer;min-height:56px}
nav.bottom button .bar{display:none}
nav.bottom button svg{box-sizing:content-box;padding:4px 18px;border-radius:999px;transition:background-color .2s ease}
nav.bottom button[aria-current="page"]{color:var(--fg);font-weight:700}
nav.bottom button[aria-current="page"] svg{background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--muted);line-height:1.45}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app" aria-live="polite">
  <div class="stack" style="padding-top:40px">
    <span class="eyebrow">Treino e Nutrição</span>
    <h1>Carregando seus dados…</h1>
    <p class="muted">Seu perfil, exames e plano aparecem aqui em instantes.</p>
  </div>
</div>
<nav class="bottom" aria-label="Navegação principal" hidden>
  <div class="in">
    <button data-tab="inicio"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
    <button data-tab="exames"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Exames</button>
    <button data-tab="treino"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Treino</button>
    <button data-tab="dieta"><span class="bar"></span><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v7a2 2 0 0 0 2 2v9M5 3v5M9 3v5M17 3c-2 2-3 4-3 7h3v11"/></svg>Alimentação</button>
  </div>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
"use strict";
const $app = document.getElementById('app');
const $nav = document.querySelector('nav.bottom');

const S = {
  ready:false, cfg:null,
  tab:'inicio', sub:null,
  perfil:null, exames:[], plano:null, registro:{treinos:[]},
  dia:null, feitos:{}, busy:null, erro:null, rascunho:null, chat:[], confirmDel:null, editPerfil:false
};

/* ---------- utilidades ---------- */
const h = (v)=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v,d=0)=>{const n=Number(v);return isFinite(n)?n.toLocaleString('pt-BR',{maximumFractionDigits:d}):'—';};
const hoje = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fmtData = (iso)=>{if(!iso)return '';const p=String(iso).split('-');if(p.length<3)return h(iso);const m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+p[1]-1]||p[1];return (+p[2])+' '+m+' '+p[0];};
const uidGen = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
/* ---------- cofre: dados criptografados (AES-GCM) com uma chave mestra.
   A chave mestra fica guardada duas vezes: travada pela senha e travada pelo código de recuperação. ---------- */
const CHAVES=['perfil','exames','plano','registro','feitos','cfg','cfgVisto'];
const ITER=310000;
const COFRE={key:null, mestra:null, cache:{}, fila:Promise.resolve()};
const rawGet=(k)=>{try{const v=localStorage.getItem('tn:'+k);return v?JSON.parse(v):null;}catch(e){return null;}};
const rawSet=(k,v)=>{localStorage.setItem('tn:'+k,JSON.stringify(v));};
const rawDel=(k)=>{try{localStorage.removeItem('tn:'+k);}catch(e){}};
const b64=(buf)=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s);};
const unb64=(t)=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const temCripto=()=>!!(window.crypto&&crypto.subtle&&window.isSecureContext);
async function derivar(segredo,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(segredo),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const chaveDe=(bytes)=>crypto.subtle.importKey('raw',bytes,{name:'AES-GCM'},false,['encrypt','decrypt']);
async function cifrarBytes(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes);return {iv:b64(iv),ct:b64(ct)};}
async function decifrarBytes(key,pac){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(pac.iv)},key,unb64(pac.ct)));}
const cifrar=(key,obj)=>cifrarBytes(key,new TextEncoder().encode(JSON.stringify(obj)));
async function decifrar(key,pac){return JSON.parse(new TextDecoder().decode(await decifrarBytes(key,pac)));}

// código de recuperação: 20 caracteres sem letras ambíguas, em grupos de 4
const ALFA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function gerarCodigo(){const r=crypto.getRandomValues(new Uint8Array(20));let c='';for(let i=0;i<20;i++){c+=ALFA[r[i]%32];if(i%4===3&&i<19)c+='-';}return c;}
const normCodigo=(t)=>String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/O/g,'0').replace(/I/g,'1');
async function embrulhar(segredo,mestra){const salt=crypto.getRandomValues(new Uint8Array(16));const k=await derivar(segredo,salt,ITER);return {salt:b64(salt),iter:ITER,pac:await cifrarBytes(k,mestra)};}
async function desembrulhar(segredo,emb){const k=await derivar(segredo,unb64(emb.salt),emb.iter);return decifrarBytes(k,emb.pac);}

async function carregarCache(mestra){
  const key=await chaveDe(mestra); const cache={};
  for(const k of CHAVES){ const pac=rawGet('x:'+k); if(pac){ try{cache[k]=await decifrar(key,pac);}catch(e){} } }
  COFRE.key=key; COFRE.mestra=mestra; COFRE.cache=cache;
}
// abre com a senha (ou com o código, se porCodigo); devolve false se não confere
async function abrirCofre(segredo,porCodigo){
  const c=rawGet('cofre'); if(!c) return false;
  let mestra; try{ mestra=await desembrulhar(porCodigo?normCodigo(segredo):segredo, porCodigo?c.codigo:c.senha); }catch(e){ return false; }
  await carregarCache(mestra); return true;
}
// cria o cofre com os dados em memória; devolve o código de recuperação
async function criarCofre(senha,dados,email){
  const mestra=crypto.getRandomValues(new Uint8Array(32)); const key=await chaveDe(mestra);
  const pacotes={}; for(const k of CHAVES){ if(dados[k]!==undefined&&dados[k]!==null) pacotes[k]=await cifrar(key,dados[k]); }
  const codigo=gerarCodigo();
  const cofre={v:2, senha:await embrulhar(senha,mestra), codigo:await embrulhar(normCodigo(codigo),mestra), email:email||''};
  for(const k of CHAVES){ if(pacotes[k]) rawSet('x:'+k,pacotes[k]); else rawDel('x:'+k); }
  rawSet('cofre',cofre);
  for(const k of CHAVES) rawDel(k);   // apaga cópias antigas sem criptografia
  COFRE.key=key; COFRE.mestra=mestra; COFRE.cache=Object.assign({},dados);
  return codigo;
}
// com o cofre aberto: troca só a senha (dados e código continuam)
async function novaSenha(senha){ const c=rawGet('cofre'); c.senha=await embrulhar(senha,COFRE.mestra); rawSet('cofre',c); }
// com o cofre aberto: novo código (o antigo deixa de valer)
async function novoCodigo(){ const c=rawGet('cofre'); const cod=gerarCodigo(); c.codigo=await embrulhar(normCodigo(cod),COFRE.mestra); rawSet('cofre',c); return cod; }
function salvarEmail(email){ const c=rawGet('cofre'); if(c){ c.email=email; rawSet('cofre',c); } }
function fecharCofre(){ COFRE.key=null; COFRE.mestra=null; COFRE.cache={}; }
const mascarar=(e)=>{const m=String(e||'').match(/^(.)(.*)(@.*)$/);return m?m[1]+'•••'+m[3]:'';};
const emailValido=(e)=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e||'').trim());
const lsGet=(k)=>{const v=COFRE.cache[k];return v===undefined?null:v;};
function lsSet(k,v){
  COFRE.cache[k]=v; const key=COFRE.key; if(!key) return COFRE.fila;
  COFRE.fila=COFRE.fila.then(async()=>{ try{ rawSet('x:'+k, await cifrar(key,v)); }catch(e){ toast('O celular não deixou salvar. Libere espaço ou apague exames antigos.'); } });
  return COFRE.fila;
}

const RESERVA = { gemini:['gemini-3.6-flash','gemini-3.5-flash-lite'], claude:['claude-haiku-5-5'], openai:['gpt-6-luna'] };
const espera = (ms,signal)=>new Promise((ok,err)=>{const t=setTimeout(ok,ms); if(signal) signal.addEventListener('abort',()=>{clearTimeout(t);err({code:'cancelled'});},{once:true});});
const iaPronta = ()=>!!(S.cfg&&S.cfg.provedor&&S.cfg.chave);

function blobParaB64(blob){return new Promise((ok,err)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=()=>err({code:'image_rejected'});r.readAsDataURL(blob);});}
async function prepararImagem(blob){
  // reduz para no máximo 1600 px no lado maior e converte para JPEG
  try{
    const bmp=await createImageBitmap(blob);
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(bmp,0,0,c.width,c.height);
    const out=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return {mime:'image/jpeg', data:await blobParaB64(out)};
  }catch(e){ throw {code:'image_rejected'}; }
}

async function chamarIA(turns, opts){
  opts=opts||{};
  if(!iaPronta()) throw {code:'sem_chave'};
  if(!navigator.onLine) throw {code:'offline'};
  const provedor=S.cfg.provedor; const escolhido=(S.cfg.modelo||'').trim();
  // modelo escolhido pela pessoa: só ele. Modelo padrão: padrão e reservas.
  const modelos = escolhido ? [escolhido] : [PROV[provedor].modelo].concat(RESERVA[provedor]||[]);
  const imgs=[]; for(const b of (opts.images||[])) imgs.push(await prepararImagem(b));
  let ultimoErro=null;
  for(let m=0;m<modelos.length;m++){
    for(let tentativa=0;tentativa<2;tentativa++){
      try{ return await chamarModelo(modelos[m], turns, imgs, opts); }
      catch(e){
        ultimoErro=e;
        const passageiro = e && (e.code==='ocupado');
        const trocar = passageiro || (e && e.code==='modelo' && m>0) || (e && e.code==='modelo' && !escolhido);
        if(!trocar) throw e;
        if(passageiro && tentativa===0){ if(opts.onStatus) opts.onStatus('Modelo ocupado. Tentando de novo…'); await espera(2500,opts.signal); continue; }
        if(m<modelos.length-1 && opts.onStatus) opts.onStatus('Modelo ocupado. Usando um modelo alternativo…');
        break;
      }
    }
  }
  throw ultimoErro||{code:'upstream_error'};
}

async function chamarModelo(modelo, turns, imgs, opts){
  const {provedor,chave}=S.cfg;
  const last=turns.length-1;
  let url, headers, body;
  if(provedor==='gemini'){
    url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(modelo)+':generateContent';
    headers={'content-type':'application/json','x-goog-api-key':chave};
    body={contents:turns.map((t,i)=>({role:t.role==='assistant'?'model':'user',parts:[...(i===last?imgs.map(m=>({inline_data:{mime_type:m.mime,data:m.data}})):[]),{text:t.content}]})),
          generationConfig:opts.json?{responseMimeType:'application/json'}:{}};
  }else if(provedor==='claude'){
    url='https://api.anthropic.com/v1/messages';
    headers={'content-type':'application/json','x-api-key':chave,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
    body={model:modelo,max_tokens:opts.json?12000:1500,messages:turns.map((t,i)=>({role:t.role,content:[...(i===last?imgs.map(m=>({type:'image',source:{type:'base64',media_type:m.mime,data:m.data}})):[]),{type:'text',text:t.content}]}))};
  }else{
    url='https://api.openai.com/v1/chat/completions';
    headers={'content-type':'application/json','authorization':'Bearer '+chave};
    body={model:modelo,messages:turns.map((t,i)=>({role:t.role,content:[{type:'text',text:t.content},...(i===last?imgs.map(m=>({type:'image_url',image_url:{url:'data:'+m.mime+';base64,'+m.data}})):[])]}))};
    if(opts.json) body.response_format={type:'json_object'};
  }
  let r;
  try{ r=await fetch(url,{method:'POST',headers,body:JSON.stringify(body),signal:opts.signal}); }
  catch(e){ if(e&&e.name==='AbortError') throw {code:'cancelled'}; throw {code:'rede'}; }
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){
    const msg=(j&&(j.error&&(j.error.message||j.error.type)))||('HTTP '+r.status);
    if(r.status===401||r.status===403) throw {code:'chave',message:msg};
    if(r.status===404) throw {code:'modelo',message:msg};
    if(r.status===503||r.status===529||r.status===500||/overload|high demand|unavailable|capacity/i.test(msg)) throw {code:'ocupado',message:msg};
    if(r.status===429) throw {code:'rate_limited',message:msg};
    if(r.status===400&&/key/i.test(msg)) throw {code:'chave',message:msg};
    if(r.status===413) throw {code:'prompt_too_large',message:msg};
    throw {code:'upstream_error',message:msg};
  }
  let txt='';
  if(provedor==='gemini'){ const c=j&&j.candidates&&j.candidates[0]; txt=(c&&c.content&&c.content.parts||[]).map(p=>p.text||'').join(''); if(!txt&&j&&j.promptFeedback&&j.promptFeedback.blockReason) throw {code:'refused'}; }
  else if(provedor==='claude'){ txt=(j&&j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join(''); }
  else { txt=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||''; }
  if(!txt) throw {code:'empty_completion'};
  return txt;
}
function extrairJSON(txt){
  try{return JSON.parse(txt);}catch(e){}
  const f=txt.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){try{return JSON.parse(f[1]);}catch(e){}}
  const a=txt.search(/[\{\[]/), b=Math.max(txt.lastIndexOf('}'),txt.lastIndexOf(']'));
  if(a>=0&&b>a){try{return JSON.parse(txt.slice(a,b+1));}catch(e){}}
  throw {code:'invalid_json'};
}
const ia = {
  json: async (prompt,opts)=>extrairJSON(await chamarIA([{role:'user',content:prompt+'\n\nResponda apenas com o JSON, sem texto antes ou depois.'}],Object.assign({},opts,{json:true}))),
  chat: (turns,opts)=>chamarIA(turns,opts)
};

function erroIA(e){
  const c=e&&e.code;
  if(c==='sem_chave') return 'Configure a IA antes: toque no ícone de pessoa › Configurar IA.';
  if(c==='offline') return 'Sem internet. Conecte e tente de novo.';
  if(c==='rede') return 'Não consegui falar com o serviço de IA. Confira a internet e tente de novo.';
  if(c==='chave') return 'A chave de API foi recusada. Confira se copiou inteira em Configurar IA.';
  if(c==='modelo') return 'O modelo informado não existe ou não está liberado para essa chave. Em Configurar IA, apague o campo Modelo para usar o padrão.';
  if(c==='ocupado') return 'Os servidores da IA estão sobrecarregados agora. O app já tentou de novo e trocou de modelo. Espere alguns minutos e tente outra vez.';
  if(c==='rate_limited') return 'Limite de uso da IA atingido por enquanto. Espere alguns minutos ou confira seu crédito no site do provedor.';
  if(c==='image_rejected') return 'Não consegui ler esse arquivo. Tente uma foto mais nítida ou outro formato (JPG, PNG ou PDF).';
  if(c==='invalid_json'||c==='empty_completion') return 'A resposta da IA veio incompleta. Tente de novo.';
  if(c==='prompt_too_large') return 'Há informação demais para enviar de uma vez. Apague exames antigos e tente de novo.';
  if(c==='refused') return 'A IA não aceitou esse pedido. Revise os dados e tente de novo.';
  if(c==='cancelled') return null;
  return 'A IA não respondeu agora'+(e&&e.message?' ('+String(e.message).slice(0,140)+')':'')+'. Tente de novo em alguns instantes.';
}

const MAX_PAGINAS = 40;   // páginas por laudo
const LOTE = 4;           // páginas enviadas à IA por chamada

const normNome = (t)=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%]+/g,' ').trim();
const limparItem = (i)=>({nome:String(i.nome||'').trim(),valor:String(i.valor??'').trim(),unidade:String(i.unidade||'').trim(),referencia:String(i.referencia||'').trim(),situacao:String(i.situacao||'sem_referencia')});

function promptLaudo(origem, tipoInf, dataInf){
  return `Você extrai dados de laudos de saúde (exame de sangue, bioimpedância, avaliação física) em português.
${origem}
${tipoInf?'Tipo informado: '+tipoInf+'.':''} ${dataInf?'Data informada: '+dataInf+'.':''}
Responda SOMENTE com JSON:
{"tipo":"sangue|bioimpedancia|avaliacao|outro","data":"AAAA-MM-DD ou vazio","laboratorio":"nome ou vazio","itens":[{"nome":"Glicose","valor":"102","unidade":"mg/dL","referencia":"70 a 99","situacao":"normal|baixo|alto|sem_referencia"}],"observacao":"1 frase com o que chamou atenção, sem diagnóstico, ou vazio"}
Copie valores e referências exatamente como estão. Para bioimpedância, inclua peso, % de gordura, massa muscular, gordura visceral, água e taxa metabólica quando houver. Em hemograma e urina, use o nome completo do item (ex.: "Leucócitos (urina)") para não confundir com o do sangue. Não invente itens que não aparecem. Páginas sem resultados (capa, instruções, assinatura) geram "itens":[].`;
}

// Lista as páginas sem renderizar ainda: imagens prontas ou páginas de PDF
async function listarPaginas(files){
  const lib=window.pdfjsLib; const pags=[]; let total=0;
  for(const f of files){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){
      if(!lib) throw {code:'pdf'};
      let pdf;
      try{ lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise; }
      catch(e){ throw {code:'pdf'}; }
      for(let i=1;i<=pdf.numPages;i++){ total++; if(pags.length<MAX_PAGINAS) pags.push({pdf,n:i}); }
    }else{ total++; if(pags.length<MAX_PAGINAS) pags.push({blob:f}); }
  }
  return {pags,total};
}
async function renderPagina(p){
  if(p.blob) return p.blob;
  try{
    const pg=await p.pdf.getPage(p.n); const vp=pg.getViewport({scale:1.8});
    const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
    const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height);
    await pg.render({canvasContext:ctx,viewport:vp}).promise;
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)); c.width=c.height=0; return b;
  }catch(e){ throw {code:'pdf'}; }
}

async function lerExame(files, texto, tipoInf, dataInf){
  if(!iaPronta()){S.erro=erroIA({code:'sem_chave'});render();return;}
  S.busy={tipo:'exame',txt:'Lendo o laudo…'};S.erro=null;render();
  const status=(t)=>{S.busy={tipo:'exame',txt:t};render();};
  try{
    // texto digitado: uma chamada só
    if(!files||!files.length){
      const r=await ia.json(promptLaudo('Texto digitado pela pessoa:\n+texto+',tipoInf,dataInf),{onStatus:status});
      if(!r||!Array.isArray(r.itens)) throw {code:'invalid_json'};
      abrirRevisao([r],tipoInf,dataInf,[]); return;
    }
    status('Abrindo o laudo…');
    const {pags,total}=await listarPaginas(files);
    if(!pags.length) throw {code:'image_rejected'};
    const lotes=[]; for(let i=0;i<pags.length;i+=LOTE) lotes.push(pags.slice(i,i+LOTE));
    const respostas=[], falhas=[]; let erroFatal=null;
    for(let k=0;k<lotes.length;k++){
      const ini=k*LOTE+1, fim=ini+lotes[k].length-1, faixa=ini===fim?'página '+ini:'páginas '+ini+' a '+fim;
      const msg=pags.length<=LOTE?'Lendo os valores do laudo. Isso leva alguns segundos.':'Lendo '+faixa+' de '+pags.length+'…';
      status(msg);
      try{
        const imgs=[]; for(const p of lotes[k]) imgs.push(await renderPagina(p));
        const origem = 'As imagens anexas são as '+faixa+' de um laudo com '+pags.length+' páginas.';
        let r;
        try{ r=await ia.json(promptLaudo(origem,tipoInf,dataInf),{images:imgs,onStatus:status}); }
        catch(e){
          // limite por minuto do plano gratuito: espera e tenta uma vez
          if(e&&e.code==='rate_limited'){ status('Limite por minuto da IA atingido. Aguardando 30 segundos para continuar…'); await espera(30000); status(msg); r=await ia.json(promptLaudo(origem,tipoInf,dataInf),{images:imgs,onStatus:status}); }
          else throw e;
        }
        if(r&&Array.isArray(r.itens)) respostas.push(r); else falhas.push(faixa);
      }catch(e){
        const c=e&&e.code;
        if(['sem_chave','chave','offline','cancelled','rate_limited','modelo'].includes(c)){ erroFatal=e; falhas.push('páginas '+ini+' em diante'); break; }
        falhas.push(faixa);
      }
    }
    if(!respostas.some(r=>r.itens.length)) throw erroFatal||{code:'invalid_json'};
    const avisos=[];
    if(total>pags.length) avisos.push('O laudo tem '+total+' páginas. Li as '+pags.length+' primeiras; envie o resto como outro exame.');
    if(falhas.length) avisos.push('Não consegui ler: '+falhas.join(', ')+'. Confira esses valores no laudo e use "Digitar os valores" se faltar algo.');
    abrirRevisao(respostas,tipoInf,dataInf,avisos);
  }catch(e){S.busy=null;S.erro=(e&&e.code==='pdf')?'Não consegui abrir esse PDF. Tente tirar uma foto das páginas.':erroIA(e);render();}
}

function abrirRevisao(respostas,tipoInf,dataInf,avisos){
  const pega=(campo)=>{for(const r of respostas){if(r[campo])return String(r[campo]);}return '';};
  const vistos=new Set(), itens=[];
  for(const r of respostas) for(const bruto of (r.itens||[])){
    const i=limparItem(bruto); if(!i.nome) continue;
    const chave=normNome(i.nome)+'|'+i.valor; if(vistos.has(chave)) continue; vistos.add(chave); itens.push(i);
  }
  const obs=respostas.map(r=>r.observacao).filter(Boolean).slice(0,2).join(' ');
  S.rascunho={id:uidGen(),tipo:pega('tipo')||tipoInf||'outro',data:pega('data')||dataInf||hoje(),laboratorio:pega('laboratorio'),observacao:obs,itens,avisos};
  S.busy=null; S.sub='revisar'; render(); window.scrollTo(0,0);
}

let chatCtl=null;
async function perguntar(texto){
  if(!iaPronta()){S.erro=erroIA({code:'sem_chave'});render();return;}
  S.chat.push({role:'user',content:texto}); S.chat.push({role:'assistant',content:'',pend:true}); render();
  const sys = REGRAS+'\n\n'+contexto()+'\nPLANO ATUAL: '+JSON.stringify(S.plano?{resumo:S.plano.resumo,treino:S.plano.treino,dieta:{calorias:S.plano.dieta.calorias,proteina_g:S.plano.dieta.proteina_g}}:null).slice(0,20000)+'\n\nResponda à pergunta abaixo em até 150 palavras, em texto simples sem markdown.';
  const turns = S.chat.filter(m=>!m.pend).slice(-8).map((m,i,a)=>({role:m.role,content:(i===a.length-1&&m.role==='user')?sys+'\n\nPERGUNTA: '+m.content:m.content}));
  while(turns.length&&turns[0].role!=='user')turns.shift();
  const alvo=S.chat[S.chat.length-1];
  chatCtl=new AbortController();
  try{
    const r=await ia.chat(turns,{signal:chatCtl.signal});
    alvo.content=r; alvo.pend=false;
  }catch(e){const m=erroIA(e); alvo.content=m||'Pergunta cancelada.'; alvo.pend=false;}
  chatCtl=null; render();
}

function header(titulo, voltar){
  return `<div class="row" style="gap:4px">${voltar?`<button class="iconbtn" style="border:0;background:none;margin-left:-10px" data-act="voltar" aria-label="Voltar">${ICON.back}</button>`:''}<h1 style="font-size:${voltar?22:28}px;flex:1">${h(titulo)}</h1></div>`;
}
function statusBox(){
  let o='';
  if(S.busy) o+=`<div class="status info row" role="status"><span class="spinner" aria-hidden="true"></span><span>${h(S.busy.txt)}</span></div>`;
  if(S.erro) o+=`<div class="status bad row" role="alert">${ICON.warn}<span style="flex:1">${h(S.erro)}</span><button class="iconbtn" style="width:36px;height:36px;background:transparent;border:0;color:inherit" data-act="fecharErro" aria-label="Fechar aviso">×</button></div>`;
  return o;
}
const situ = (s)=>{s=String(s||'').toLowerCase();
  if(s==='normal') return '<span class="pill ok">Na faixa</span>';
  if(s==='baixo') return `<span class="pill warn">${ICON.warn.replace('20','14').replace('20','14')}Baixo</span>`;
  if(s==='alto') return `<span class="pill warn">${ICON.warn.replace('20','14').replace('20','14')}Alto</span>`;
  return '<span class="pill info">Sem ref.</span>';};
const TIPOS={sangue:'Exame de sangue',bioimpedancia:'Bioimpedância',avaliacao:'Avaliação física',outro:'Outro exame'};

function telaPerfil(){
  const p=S.perfil||{};
  const novo=!S.perfil;
  const opt=(arr,v)=>arr.map(([k,t])=>`<option value="${k}"${String(v)===k?' selected':''}>${t}</option>`).join('');
  return `${novo?`<div class="stack-s" style="padding-top:12px"><span class="eyebrow">Primeiro acesso</span><h1>Vamos conhecer você</h1><p class="muted">Com esses dados o avaliador monta treino e alimentação do seu jeito. Leva 1 minuto.</p></div>`:header('Seu perfil',true)}
  <form id="fPerfil" class="stack" novalidate>
    <label class="f">Como quer ser chamado<input id="pNome" name="nome" required value="${h(p.nome)}" autocomplete="given-name"></label>
    <div class="grid2">
      <label class="f">Sexo<select id="pSexo" name="sexo">${opt([['masculino','Masculino'],['feminino','Feminino']],p.sexo)}</select></label>
      <label class="f">Idade<input id="pIdade" name="idade" type="number" inputmode="numeric" min="12" max="100" value="${h(p.idade)}"></label>
      <label class="f">Altura (cm)<input id="pAltura" name="altura" type="number" inputmode="numeric" min="120" max="230" value="${h(p.altura)}"></label>
      <label class="f">Peso (kg)<input id="pPeso" name="peso" type="number" inputmode="decimal" step="0.1" min="30" max="300" value="${h(p.peso)}"></label>
    </div>
    <label class="f">Objetivo principal<select id="pObj" name="objetivo">${opt([['perder gordura','Perder gordura'],['ganhar massa muscular','Ganhar massa muscular'],['recomposição corporal','Perder gordura e ganhar músculo'],['saúde e condicionamento','Saúde e condicionamento'],['força e desempenho','Força e desempenho']],p.objetivo)}</select></label>
    <div class="grid2">
      <label class="f">Experiência<select id="pNivel" name="nivel">${opt([['iniciante','Iniciante'],['intermediário','Intermediário'],['avançado','Avançado']],p.nivel)}</select></label>
      <label class="f">Onde treina<select id="pLocal" name="local">${opt([['academia','Academia'],['casa com halteres','Casa com halteres'],['casa sem equipamento','Casa sem equipamento']],p.local)}</select></label>
      <label class="f">Dias por semana<select id="pDias" name="dias">${opt([['2','2 dias'],['3','3 dias'],['4','4 dias'],['5','5 dias'],['6','6 dias']],p.dias||'4')}</select></label>
      <label class="f">Tempo por treino<select id="pMin" name="minutos">${opt([['30','30 min'],['45','45 min'],['60','60 min'],['75','75 min'],['90','90 min']],p.minutos||'60')}</select></label>
    </div>
    <label class="f">Lesões, dores ou problemas de saúde<textarea id="pLesoes" name="lesoes" placeholder="Ex.: dor no joelho direito, hipertensão controlada">${h(p.lesoes)}</textarea></label>
    <label class="f">Alimentação: o que não come ou prefere<textarea id="pAlim" name="alimentacao" placeholder="Ex.: não como peixe, prefiro almoçar fora, intolerância à lactose">${h(p.alimentacao)}</textarea></label>
    <button class="btn block" type="submit">${novo?'Continuar':'Salvar perfil'}</button>
    ${!novo&&S.plano?'<p class="note">Mudou objetivo, dias ou tempo? Depois de salvar, gere o plano de novo na tela inicial.</p>':''}
  </form>
  ${!novo?`<div class="card stack"><h3>Inteligência artificial</h3><p class="small muted">${iaPronta()?'Usando '+h(PROV[S.cfg.provedor].nome)+' · modelo '+h(S.cfg.modelo||PROV[S.cfg.provedor].modelo):'Nenhuma IA configurada.'}</p><button class="btn ghost block" data-act="config">Configurar IA</button></div>
  <div class="card stack"><h3>Senha e recuperação</h3><p class="small muted">O app pede a senha ao abrir e depois de 5 minutos fora dele.${(rawGet('cofre')||{}).email?' E-mail de recuperação: '+h(mascarar(rawGet('cofre').email))+'.':' Nenhum e-mail de recuperação cadastrado.'}</p>
  <div class="grid2"><button class="btn ghost" data-act="trocarSenha">Trocar senha</button><button class="btn ghost" data-act="bloquear">Bloquear agora</button></div>
  <button class="btn ghost block" data-act="gerarCodigo">Novo código de recuperação</button></div>
  <div class="card stack"><h3>Seus dados</h3><p class="small muted">Ficam guardados só neste celular, criptografados com a sua senha. Se apagar os dados do navegador ou trocar de aparelho, eles se perdem. Faça uma cópia de vez em quando.</p>
  <div class="grid2"><button class="btn ghost" data-act="exportar">Salvar cópia</button><label class="btn ghost" for="fImp" style="cursor:pointer">Restaurar cópia</label></div><input id="fImp" class="sr" type="file" accept="application/json,.json"></div>`:''}`;
}

function telaConfig(){
  const c=S.cfg||{provedor:'gemini',chave:'',modelo:''}; const pv=PROV[c.provedor]||PROV.gemini;
  const primeiro=!iaPronta();
  return `${primeiro&&!S.editCfg?`<div class="stack-s" style="padding-top:12px"><span class="eyebrow">Último passo</span><h1>Escolha a IA</h1><p class="muted">O app usa a IA que você escolher, com a sua chave. A chave fica guardada só neste celular.</p></div>`:header('Configurar IA',true)}
  ${statusBox()}
  <form id="fCfg" class="stack" novalidate>
    <fieldset class="stack-s" style="border:0;padding:0;margin:0"><legend class="small muted" style="font-weight:600;margin-bottom:6px">Provedor</legend>
      <div class="chips">${Object.entries(PROV).map(([k,v])=>`<button type="button" class="chip" aria-pressed="${c.provedor===k}" data-act="prov" data-p="${k}">${h(v.nome)}</button>`).join('')}</div></fieldset>
    <div class="card stack-s"><p class="small">${h(pv.dica)}</p><a class="small" href="${pv.chave}" target="_blank" rel="noopener" style="font-weight:700">Abrir página de chaves</a></div>
    <label class="f">Chave de API<input id="cChave" type="password" autocomplete="off" spellcheck="false" value="${h(c.chave)}" placeholder="Cole a chave aqui"></label>
    <label class="f">Modelo (opcional)<input id="cModelo" autocomplete="off" spellcheck="false" value="${h(c.modelo)}" placeholder="${h(pv.modelo)}"></label>
    <p class="note">Deixe o modelo em branco para usar o padrão. Só troque se o provedor lançar um modelo novo ou desativar o atual.</p>
    <div class="grid2"><button type="button" class="btn ghost" data-act="testar"${S.busy?' disabled':''}>Testar</button><button class="btn" type="submit">Salvar</button></div>
    ${iaPronta()?'<button type="button" class="btn plain block" data-act="rmChave">Apagar chave deste celular</button>':''}
    ${primeiro&&!S.editCfg?'<button type="button" class="btn plain block" data-act="pularCfg">Configurar depois</button>':''}
  </form>`;
}

function telaSenha(){
  const L=S.lock; const espera=Math.max(0,Math.ceil(((S.bloqAte||0)-Date.now())/1000));
  const avisos=`${S.erro?`<div class="status bad row" role="alert">${ICON.warn}<span>${h(S.erro)}</span></div>`:''}${S.busy?`<div class="status info row" role="status"><span class="spinner" aria-hidden="true"></span><span>${h(S.busy.txt)}</span></div>`:''}`;
  const mostrar='<label class="row small" style="gap:8px;min-height:44px"><input class="mostrar" type="checkbox" style="width:22px;min-height:22px"> Mostrar senha</label>';
  if(L==='semCripto') return `<div class="stack" style="padding-top:40px"><span class="eyebrow">Treino e Nutrição</span><h1>Abra pelo endereço seguro</h1><p class="muted">A proteção por senha só funciona no endereço que começa com https://. Abra o app pelo link do GitHub Pages.</p></div>`;
  if(L==='codigo') return telaCodigo(false);
  if(L==='recuperar'){
    const c=rawGet('cofre')||{};
    return `<div class="stack-s" style="padding-top:24px"><span class="eyebrow">Esqueci a senha</span><h1>Use o código de recuperação</h1>
    <p class="muted">${c.email?'Ele foi enviado para '+h(mascarar(c.email))+' quando você criou a senha. Procure por "Treino e Nutrição" no e-mail.':'É o código de 20 caracteres que o app mostrou quando você criou a senha.'}</p></div>
    ${avisos}
    <form id="fRecuperar" class="stack" novalidate>
      <input type="text" name="username" value="treino-nutricao" autocomplete="username" hidden>
      <label class="f">Código de recuperação<input id="rCodigo" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" style="font-variant-numeric:tabular-nums;letter-spacing:.04em"></label>
      <label class="f">Nova senha<input id="rNova" type="password" autocomplete="new-password"></label>
      <label class="f">Repita a nova senha<input id="rNova2" type="password" autocomplete="new-password"></label>
      ${mostrar}
      <button class="btn block" type="submit"${S.busy||espera?' disabled':''}>${espera?'Aguarde '+espera+' s':'Criar nova senha'}</button>
      <div class="grid2"><button type="button" class="btn plain" data-act="lockVoltar">Voltar</button><button type="button" class="btn plain" data-act="semCodigo">Não tenho o código</button></div>
    </form>`;
  }
  if(L==='apagar') return `<div class="stack" style="padding-top:24px"><span class="eyebrow">Sem senha e sem código</span><h1>Apagar e começar de novo?</h1>
    <p class="muted">Sem a senha ou o código, ninguém consegue destravar os dados, nem o app. Para voltar a usar, é preciso apagar tudo deste celular: perfil, exames, plano e a chave de IA.</p>
    <p class="muted">Se você tiver uma cópia de segurança (.json), dá para restaurar depois em Perfil › Restaurar cópia.</p>
    <div class="grid2"><button class="btn plain" data-act="lockVoltar">Voltar</button><button class="btn danger" data-act="apagarTudo">Apagar tudo</button></div></div>`;
  const criar=L==='criar';
  return `<div class="stack-s" style="padding-top:24px"><span class="eyebrow">Treino e Nutrição</span>
    <h1>${criar?'Crie uma senha':'Digite sua senha'}</h1>
    <p class="muted">${criar?(S.migrar?'Seus exames, plano e chave de IA vão ficar protegidos por ela neste celular.':'Ela protege seus exames, seu plano e sua chave de IA neste celular.'):'Seus dados estão protegidos.'}</p></div>
  ${avisos}
  <form id="fSenha" class="stack" novalidate>
    <input type="text" name="username" value="treino-nutricao" autocomplete="username" hidden>
    <label class="f">${criar?'Nova senha':'Senha'}<input id="sSenha" type="password" autocomplete="${criar?'new-password':'current-password'}"></label>
    ${criar?`<label class="f">Repita a senha<input id="sSenha2" type="password" autocomplete="new-password"></label>
    <label class="f">E-mail para recuperação (opcional)<input id="sEmail" type="email" inputmode="email" autocomplete="email" value="${h(S.emailRasc||'')}" placeholder="voce@exemplo.com"></label>
    <p class="note">Senha com no mínimo 4 caracteres; pode ser só números. No próximo passo o app gera um código de recuperação e prepara um e-mail com ele para você mesmo.</p>`:''}
    ${mostrar}
    <button class="btn block" type="submit"${S.busy||espera?' disabled':''}>${espera?'Aguarde '+espera+' s':(criar?'Criar senha':'Entrar')}</button>
    ${criar?'':'<button type="button" class="btn plain block" data-act="esqueci">Esqueci a senha</button>'}
  </form>`;
}

function linkEmail(email,codigo){
  const corpo='Código de recuperação do app Treino e Nutrição:\n\n'+codigo+'\n\nSe esquecer a senha, abra o app, toque em "Esqueci a senha" e digite este código para criar uma senha nova sem perder seus dados.\n\nEndereço do app: '+location.origin+location.pathname+'\n\nGuarde este e-mail e não o encaminhe para ninguém.';
  return 'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent('Código de recuperação · Treino e Nutrição')+'&body='+encodeURIComponent(corpo);
}

// mostra o código recém-gerado (na criação da senha ou ao gerar um novo pelo perfil)

  <button type="button" class="btn block" data-act="codigoOk"${S.guardei?'':' disabled'}>Continuar</button>`;

function telaTrocaSenha(){
  return header('Trocar senha',true)+statusBox()+`<form id="fTroca" class="stack" novalidate>
    <input type="text" name="username" value="treino-nutricao" autocomplete="username" hidden>
    <label class="f">Senha atual<input id="tAtual" type="password" autocomplete="current-password"></label>
    <label class="f">Nova senha<input id="tNova" type="password" autocomplete="new-password"></label>
    <label class="f">Repita a nova senha<input id="tNova2" type="password" autocomplete="new-password"></label>
    <label class="row small" style="gap:8px;min-height:44px"><input class="mostrar" type="checkbox" style="width:22px;min-height:22px"> Mostrar senha</label>
    <p class="note">Mínimo de 4 caracteres. O código de recuperação continua o mesmo.</p>
    <button class="btn block" type="submit"${S.busy?' disabled':''}>Trocar senha</button></form>`;
}

function anel(feitos,total,tam){
  tam=tam||84; const r=(tam-10)/2, c=2*Math.PI*r, p=total?Math.min(1,feitos/total):0;
  return `<div class="anel" style="width:${tam}px;height:${tam}px" role="img" aria-label="${feitos} de ${total} treinos nesta semana"><svg width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" aria-hidden="true" style="transform:rotate(-90deg)"><circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="${tam/2}" cy="${tam/2}" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}"/></svg><span>${feitos}/${total}<small>semana</small></span></div>`;
}

function semana(){
  const d=new Date(); const dow=(d.getDay()+6)%7; const seg=new Date(d); seg.setDate(d.getDate()-dow);
  const feitos=new Set((S.registro.treinos||[]).map(t=>t.data));
  const nomes=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom']; let c=0;
  const cells=nomes.map((n,i)=>{const x=new Date(seg);x.setDate(seg.getDate()+i);const iso=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
    const ok=feitos.has(iso); if(ok)c++; const t=i===dow;
    return `<div><span${t?' style="color:var(--fg);font-weight:700"':''}>${t?'Hoje':n}</span><span class="dot${ok?' done':''}${t&&!ok?' today':''}" role="img" aria-label="${n}: ${ok?'treino feito':'sem treino registrado'}">${ok?ICON.check.replace(/20/g,'16'):''}</span></div>`;}).join('');
  return {cells,c};
}
function proximoDia(){
  const dias=S.plano.treino.dias; const n=(S.registro.treinos||[]).length; return dias[n%dias.length];
}

function telaInicio(){
  const p=S.perfil; const nome=(p.nome||'').split(' ')[0];
  const dataTxt=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  let o=`<div class="row between"><div class="stack-s" style="gap:2px"><span class="small muted" style="font-weight:600">${h(dataTxt.charAt(0).toUpperCase()+dataTxt.slice(1))}</span><h1>Olá, ${h(nome)}</h1></div><button class="iconbtn" data-act="perfil" aria-label="Abrir seu perfil">${ICON.user}</button></div>`;
  o+=statusBox();
  if(!iaPronta()) o+=`<button class="alert warn" style="border:0;font:inherit;text-align:left;cursor:pointer;width:100%" data-act="config">${ICON.warn}<span class="stack-s" style="gap:2px;flex:1"><strong>Configure a IA</strong><span class="small">Sem ela o app não lê exames nem monta o plano.</span></span>${ICON.arrow}</button>`;
  if(!S.plano){
    o+=`<div class="hero"><span class="eyebrow" style="color:var(--accent-ink)">Próximo passo</span><h2>Monte seu plano de treino e alimentação</h2><p class="sub">${S.exames.length?`${S.exames.length} exame${S.exames.length>1?'s':''} cadastrado${S.exames.length>1?'s':''}. O avaliador vai usar tudo isso.`:'Dá para gerar só com o perfil, mas com bioimpedância e exame de sangue o plano fica mais preciso.'}</p>
      <div class="grid2"><button class="btn light" data-act="gerar"${S.busy?' disabled':''}>Gerar plano</button><button class="btn ghost" data-tab="exames">Adicionar exame</button></div></div>`;
    return o;
  }
  const pl=S.plano; const prox=proximoDia(); const w=semana();
  o+=`<div class="hero"><div class="row between" style="align-items:flex-start;gap:14px"><div class="stack-s" style="gap:6px;min-width:0"><span class="eyebrow" style="color:var(--accent-ink)">Próximo treino</span><span class="grande">Treino ${h(prox.id)}</span><span style="font-weight:700;font-size:16px">${h(prox.titulo)}</span><span class="sub">${(prox.exercicios||[]).length} exercícios · ~${h(prox.duracao_min||S.perfil.minutos)} min</span></div>${anel(w.c,pl.treino.dias.length)}</div><button class="btn block" data-act="abrirTreino" data-dia="${h(prox.id)}">Começar treino</button></div>`;
  o+=`<div class="grid2"><button class="tile" style="text-align:left;cursor:pointer;font:inherit;color:inherit" data-tab="dieta"><span class="small muted" style="font-weight:600">Calorias do dia</span><span class="num">${num(pl.dieta.calorias)} <small>kcal</small></span></button><button class="tile" style="text-align:left;cursor:pointer;font:inherit;color:inherit" data-tab="dieta"><span class="small muted" style="font-weight:600">Proteína</span><span class="num">${num(pl.dieta.proteina_g)} <small>g</small></span></button></div>`;
  const al=(pl.alertas||[]);
  if(al.length) o+=`<button class="alert warn" style="border:0;font:inherit;text-align:left;cursor:pointer;width:100%" data-act="analise">${ICON.warn}<span class="stack-s" style="gap:2px;flex:1;min-width:0"><strong>${al.length} ponto${al.length>1?'s':''} de atenção</strong><span class="small">${h(al.slice(0,2).map(a=>a.titulo).join(' e '))}</span></span>${ICON.arrow}</button>`;
  else o+=`<button class="alert ok" style="border:0;font:inherit;text-align:left;cursor:pointer;width:100%" data-act="analise">${ICON.check}<span style="flex:1"><strong>Ver análise completa</strong></span>${ICON.arrow}</button>`;
  o+=`<div class="card stack"><div class="row between"><h3>Esta semana</h3><span class="small muted">${w.c} de ${pl.treino.dias.length} treinos</span></div><div class="week">${w.cells}</div></div>`;
  o+=`<button class="card row" style="font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%" data-act="chat">${ICON.chat}<span class="stack-s" style="gap:2px;flex:1"><strong>Pergunte ao instrutor</strong><span class="small muted">Troca de exercício, substituição de alimento, dúvidas do plano</span></span>${ICON.arrow}</button>`;
  return o;
}

function telaAnalise(){
  const pl=S.plano; const m=pl.metas||{};
  let o=header('Análise e plano',true);
  o+=`<div class="dark"><span class="eyebrow">Resumo do avaliador</span><p style="font-size:16px;line-height:1.5">${h(pl.resumo)}</p></div>`;

function telaTreino(){

  const t=S.plano.treino; if(!S.dia) S.dia=proximoDia().id;
  const d=t.dias.find(x=>x.id===S.dia)||t.dias[0];

  let o=`<div class="stack-s" style="gap:2px"><h1>Treino</h1><span class="small muted" style="font-weight:600">Divisão ${h(t.divisao||t.dias.map(x=>x.id).join(''))}${t.semanas?' · '+h(t.semanas)+' semanas':''}</span></div>`;
  o+=`<div class="tabs" role="group" aria-label="Escolher treino">${t.dias.map(x=>`<button class="chip" aria-pressed="${x.id===d.id}" data-act="dia" data-dia="${h(x.id)}" aria-label="Treino ${h(x.id)}: ${h(x.titulo)}">${h(x.id)}</button>`).join('')}</div>`;
  o+=`<div class="row between" style="align-items:flex-end"><div class="stack-s" style="gap:2px"><h2>Treino ${h(d.id)} · ${h(d.titulo)}</h2><span class="small muted">${ex.length} exercícios · cerca de ${h(d.duracao_min||'')} min</span></div><span class="small" style="font-weight:700;color:var(--accent-ink);white-space:nowrap">${feitos} de ${ex.length}</span></div>`;
  if(t.orientacao) o+=`<p class="status ok">${h(t.orientacao)}</p>`;
  o+=`<div class="stack-s">${ex.map((e,i)=>{const on=!!S.feitos[d.id+i];return `<div class="ex${on?' feito':''}"><span class="exn" aria-hidden="true">${String(i+1).padStart(2,'0')}</span><span class="txt"><strong>${h(e.nome)}</strong><span class="small muted">${h(e.series)} × ${h(e.reps)}${e.descanso?' · descanso '+h(e.descanso):''}</span>${e.dica?`<span class="small muted">${h(e.dica)}</span>`:''}</span><button class="check" aria-pressed="${on}" data-act="feito" data-k="${h(d.id+i)}" aria-label="Marcar ${h(e.nome)} como feito">${on?ICON.check:''}</button></div>`;}).join('')}</div>`;
  const jaHoje=(S.registro.treinos||[]).some(x=>x.data===hoje());
  o+=jaHoje?`<p class="status ok row">${ICON.check}<span>Treino de hoje registrado. Bom trabalho.</span></p>`:`<button class="btn block" data-act="concluir" data-dia="${h(d.id)}">Concluir treino ${h(d.id)}</button>`;
  if(t.cardio) o+=`<div class="card stack-s"><h3>Aeróbico</h3><p class="small">${h(t.cardio)}</p></div>`;
  o+=`<p class="note">Sentiu dor articular ou tontura, pare o exercício. Peça uma troca em Início › Pergunte ao instrutor.</p>`;
  return o;
}

function telaDieta(){
  if(!S.plano) return `<h1>Alimentação</h1>${semPlano()}`;
  const d=S.plano.dieta;
  let o=`<div class="stack-s" style="gap:2px"><h1>Alimentação</h1><span class="small muted" style="font-weight:600">Metas diárias</span></div>`;
  o+=`<div class="grid2"><div class="tile"><span class="small muted" style="font-weight:600">Calorias</span><span class="num">${num(d.calorias)} <small>kcal</small></span></div><div class="tile"><span class="small muted" style="font-weight:600">Água</span><span class="num">${num(d.agua_l,1)} <small>litros</small></span></div></div>`;
  { const kp=(+d.proteina_g||0)*4, kc=(+d.carbo_g||0)*4, kg=(+d.gordura_g||0)*9, kt=kp+kc+kg||1, pc=(x)=>Math.round(x/kt*100);
    o+=`<div class="card stack-s"><div class="row between"><h3>Divisão das calorias</h3><span class="small muted">${num(kp+kc+kg)} kcal dos macros</span></div><div class="macro" role="img" aria-label="Proteína ${pc(kp)}%, carboidrato ${pc(kc)}%, gordura ${pc(kg)}%"><i style="flex:${kp};background:var(--accent)"></i><i style="flex:${kc};background:var(--carb)"></i><i style="flex:${kg};background:var(--fat)"></i></div><div class="leg"><span><b style="background:var(--accent)"></b>Proteína ${pc(kp)}%</span><span><b style="background:var(--carb)"></b>Carboidrato ${pc(kc)}%</span><span><b style="background:var(--fat)"></b>Gordura ${pc(kg)}%</span></div></div>`; }
  o+=`<div class="grid3"><div class="tile"><span class="small muted" style="font-weight:600">Proteína</span><span class="num">${num(d.proteina_g)} <small>g</small></span></div><div class="tile"><span class="small muted" style="font-weight:600">Carboidrato</span><span class="num">${num(d.carbo_g)} <small>g</small></span></div><div class="tile"><span class="small muted" style="font-weight:600">Gordura</span><span class="num">${num(d.gordura_g)} <small>g</small></span></div></div>`;
  o+=`<div class="stack-s"><h3 class="muted">Cardápio de referência</h3><div class="list">${(d.refeicoes||[]).map(r=>`<div class="li" style="align-items:flex-start"><div class="meal" style="min-width:0;flex:1"><div class="row between"><strong>${h(r.nome)}</strong><span class="small muted" style="font-variant-numeric:tabular-nums">${h(r.horario||'')}</span></div><ul class="small">${(r.itens||[]).map(x=>`<li>${h(x)}</li>`).join('')}</ul></div></div>`).join('')}</div></div>`;
  if((d.dicas||[]).length) o+=`<div class="card stack-s"><h3>Dicas</h3><ul style="margin:0;padding-left:18px" class="small">${d.dicas.map(x=>`<li>${h(x)}</li>`).join('')}</ul></div>`;
  o+=`<p class="note">Quer trocar um alimento? Pergunte ao instrutor na tela inicial. Este cardápio é uma referência geral e não substitui um nutricionista.</p>`;
  return o;
}

/* ---------- render ---------- */
let ultimaTela='';
function animarSeMudou(){ const k=[S.lock,S.tab,S.sub,S.editPerfil,S.editCfg,!!S.perfil,!!S.ready].join('|'); if(k!==ultimaTela){ ultimaTela=k; $app.classList.remove('entra'); void $app.offsetWidth; $app.classList.add('entra'); } }
function render(){
  if(S.lock){ $nav.hidden=true; $app.innerHTML=telaSenha(); animarSeMudou(); return; }
  if(!S.ready) return;
  let html;
  if(S.sub==='senha'){ html=telaTrocaSenha(); $nav.hidden=false; }
  else if(S.sub==='codigo'){ html=telaCodigo(true); $nav.hidden=false; }
  else if(!S.perfil||S.editPerfil){ html=telaPerfil(); $nav.hidden=!S.perfil; }
  else if(S.editCfg||!S.cfgVisto){ html=telaConfig(); $nav.hidden=!S.cfgVisto; }
  else{
    $nav.hidden=false;
    if(S.sub==='analise'&&S.plano) html=telaAnalise();
    else if(S.sub==='chat') html=telaChat();
    else if(S.sub==='digitar') html=telaDigitar();
    else if(S.sub==='revisar'&&S.rascunho) html=telaRevisar();
    else html={inicio:telaInicio,exames:telaExames,treino:telaTreino,dieta:telaDieta}[S.tab]();
  }
  $app.innerHTML=html; animarSeMudou();
  document.querySelectorAll('nav.bottom [data-tab]').forEach(b=>{if(b.dataset.tab===S.tab&&!S.sub&&!S.editPerfil&&!S.editCfg)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
}

let toastT=null;
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.setAttribute('role','status');el.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:500px;margin:0 auto;padding:12px 16px;border-radius:14px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);font-weight:600;z-index:9';document.body.appendChild(el);}
  el.textContent=msg;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},3500);}

/* ---------- eventos ---------- */
document.addEventListener('click', async (ev)=>{
  const t=ev.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; S.sub=null; S.editPerfil=false; S.editCfg=false; S.erro=null; render(); window.scrollTo(0,0); return; }
  const a=t.dataset.act;
  if(a==='voltar'){ if(S.sub==='senha'||S.sub==='codigo'){S.sub=null;S.editPerfil=true;S.erro=null;S.novoCodigo=null;S.emailRasc=null;} else if(S.sub==='revisar'){S.rascunho=null;S.sub=null;S.tab='exames';} else if(S.editCfg){S.editCfg=false;S.cfg=lsGet('cfg')||{provedor:'gemini',chave:'',modelo:''};S.erro=null;} else if(S.editPerfil){S.editPerfil=false;} else S.sub=null; render(); window.scrollTo(0,0); }
  else if(a==='perfil'){S.editPerfil=true;render();window.scrollTo(0,0);}
  else if(a==='gerar'){ gerarPlano(); }
  else if(a==='analise'){S.sub='analise';render();window.scrollTo(0,0);}
  else if(a==='chat'){S.sub='chat';render();window.scrollTo(0,0);}
  else if(a==='abrirTreino'){S.tab='treino';S.dia=t.dataset.dia;S.sub=null;render();window.scrollTo(0,0);}
  else if(a==='dia'){S.dia=t.dataset.dia;render();}
  else if(a==='feito'){S.feitos[t.dataset.k]=!S.feitos[t.dataset.k];lsSet('feitos',S.feitos);render();}
  else if(a==='concluir'){
    const lista=(S.registro.treinos||[]).concat([{data:hoje(),dia:t.dataset.dia}]).slice(-200);
    S.registro={treinos:lista}; S.feitos={}; lsSet('feitos',{}); S.dia=null; await save('registro',S.registro); toast('Treino registrado.'); render();
  }
  else if(a==='digitar'){S.sub='digitar';S.erro=null;render();window.scrollTo(0,0);}
  else if(a==='rmItem'){syncRev();S.rascunho.itens.splice(+t.dataset.ix,1);render();}
  else if(a==='askDel'){S.confirmDel=t.dataset.id;render();}
  else if(a==='cancelDel'){S.confirmDel=null;render();}
  else if(a==='delExame'){S.exames=S.exames.filter(e=>e.id!==t.dataset.id);S.confirmDel=null;await save('exames',S.exames);toast('Exame apagado.');render();}
  else if(a==='fecharErro'){S.erro=null;render();}
  else if(a==='sugestao'){perguntar(t.textContent.trim());}
  else if(a==='parar'){if(chatCtl)chatCtl.abort();}
  else if(a==='config'){S.editPerfil=false;S.editCfg=true;S.erro=null;S.cfg=S.cfg||{provedor:'gemini',chave:'',modelo:''};render();window.scrollTo(0,0);}
  else if(a==='prov'){lerCfgForm();S.cfg.provedor=t.dataset.p;S.cfg.modelo='';render();}
  else if(a==='testar'){
    lerCfgForm(); if(!S.cfg.chave){toast('Cole a chave primeiro.');return;}
    S.busy={txt:'Testando a conexão…'};S.erro=null;render();
    try{await ia.chat([{role:'user',content:'Responda apenas: ok'}],{onStatus:(t)=>{S.busy={txt:t};render();}});S.busy=null;render();toast('Conexão funcionando.');}
    catch(e){S.busy=null;S.erro=erroIA(e);render();}
  }
  else if(a==='esqueci'){S.lock='recuperar';S.erro=null;render();}
  else if(a==='semCodigo'){S.lock='apagar';S.erro=null;render();}
  else if(a==='copiarCodigo'){
    try{ await navigator.clipboard.writeText(S.novoCodigo); toast('Código copiado.'); }
    catch(e){ const el=document.getElementById('codTxt'); const sel=getSelection(); const rg=document.createRange(); rg.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(rg); toast('Código selecionado. Toque em Copiar.'); }
  }
  else if(a==='enviarEmail'){
    const e=(document.getElementById('cEmail').value||'').trim();
    if(!emailValido(e)){ toast('Digite um e-mail válido.'); document.getElementById('cEmail').focus(); return; }
    S.emailRasc=e; salvarEmail(e);
    const ln=document.createElement('a'); ln.href=linkEmail(e,S.novoCodigo); ln.rel='noopener'; document.body.appendChild(ln); ln.click(); ln.remove();
    S.guardei=true; render(); toast('Depois de enviar o e-mail, volte aqui e toque em Continuar.');
  }
  else if(a==='codigoOk'){
    const e=document.getElementById('cEmail'); if(e&&emailValido(e.value)) salvarEmail(e.value.trim());
    S.novoCodigo=null; S.guardei=false; S.emailRasc=null;
    if(S.lock==='codigo'){ S.lock=null; await carregarDados(); toast('Tudo pronto. Seus dados estão protegidos.'); }
    else { S.sub=null; S.editPerfil=true; render(); window.scrollTo(0,0); toast('Novo código salvo.'); }
  }
  else if(a==='gerarCodigo'){
    S.busy={txt:'Gerando código…'}; render();
    try{ S.novoCodigo=await novoCodigo(); }catch(e){ S.busy=null; toast('Não consegui gerar o código. Tente de novo.'); render(); return; }
    S.busy=null; S.guardei=false; S.emailRasc=null; S.editPerfil=false; S.sub='codigo'; render(); window.scrollTo(0,0);
  }
  else if(a==='lockVoltar'){S.lock='entrar';S.erro=null;render();}
  else if(a==='apagarTudo'){
    try{ Object.keys(localStorage).filter(k=>k.startsWith('tn:')).forEach(k=>localStorage.removeItem(k)); }catch(e){}
    fecharCofre(); Object.assign(S,{perfil:null,exames:[],plano:null,registro:{treinos:[]},feitos:{},cfg:{provedor:'gemini',chave:'',modelo:''},cfgVisto:false,ready:false,migrar:false,erro:null,lock:'criar',bloqAte:0}); toast('Dados apagados.'); render();
  }
  else if(a==='bloquear'){ await COFRE.fila; bloquear(); }
  else if(a==='trocarSenha'){S.editPerfil=false;S.sub='senha';S.erro=null;render();window.scrollTo(0,0);}
  else if(a==='pularCfg'){S.cfgVisto=true;lsSet('cfgVisto',true);render();window.scrollTo(0,0);}
  else if(a==='rmChave'){S.cfg={provedor:S.cfg.provedor,chave:'',modelo:''};lsSet('cfg',S.cfg);toast('Chave apagada.');render();}
  else if(a==='exportar'){
    const dados={app:'treino-nutricao',versao:1,em:new Date().toISOString(),perfil:S.perfil,exames:S.exames,plano:S.plano,registro:S.registro};
    const blob=new Blob([JSON.stringify(dados,null,1)],{type:'application/json'});
    const u=URL.createObjectURL(blob); const ln=document.createElement('a'); ln.href=u; ln.download='treino-nutricao-'+hoje()+'.json';
    document.body.appendChild(ln); ln.click(); ln.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('Cópia salva em Downloads. A chave de API não vai junto.');
  }
});

function syncRev(){document.querySelectorAll('.rv').forEach(i=>{const r=S.rascunho.itens[+i.dataset.ix];if(r)r.valor=i.value;});const tp=document.getElementById('rTipo'),dt=document.getElementById('rData');if(tp)S.rascunho.tipo=tp.value;if(dt)S.rascunho.data=dt.value;}

function lerCfgForm(){const k=document.getElementById('cChave'),m=document.getElementById('cModelo');S.cfg=S.cfg||{provedor:'gemini'};if(k)S.cfg.chave=k.value.trim();if(m)S.cfg.modelo=m.value.trim();}

document.addEventListener('submit', async (ev)=>{
  ev.preventDefault(); const f=ev.target;
  if(f.id==='fSenha'){
    const v=document.getElementById('sSenha').value; S.erro=null;
    if(S.lock==='criar'){
      const v2=document.getElementById('sSenha2').value; const em=(document.getElementById('sEmail').value||'').trim();
      S.emailRasc=em;
      if(v.length<4){S.erro='A senha precisa ter pelo menos 4 caracteres.';render();return;}
      if(v!==v2){S.erro='As duas senhas não são iguais.';render();return;}
      if(em&&!emailValido(em)){S.erro='O e-mail parece incompleto. Corrija ou deixe em branco.';render();return;}
      S.busy={txt:'Protegendo seus dados…'};render();
      const dados={}; for(const k of CHAVES){ const x=rawGet(k); if(x!==null) dados[k]=x; }
      try{ S.novoCodigo=await criarCofre(v,dados,em); }catch(e){ S.busy=null; S.erro='Não consegui criar a senha neste aparelho. Libere espaço e tente de novo.'; render(); return; }
      S.busy=null; S.guardei=false; S.lock='codigo'; render(); window.scrollTo(0,0); return;
    }
    if(!v){render();return;}
    S.busy={txt:'Abrindo…'};render();
    let ok=false; try{ ok=await abrirCofre(v,false); }catch(e){ ok=false; }
    S.busy=null;
    if(!ok){ falhouTentativa('Senha incorreta.'); return; }
    rawDel('tentativas'); S.lock=null; S.erro=null; await carregarDados(); return;
  }
  if(f.id==='fRecuperar'){
    const cod=document.getElementById('rCodigo').value, n1=document.getElementById('rNova').value, n2=document.getElementById('rNova2').value;
    S.erro=null;
    if(normCodigo(cod).length!==20){S.erro='O código tem 20 letras e números. Confira e digite de novo.';render();return;}
    if(n1.length<4){S.erro='A nova senha precisa ter pelo menos 4 caracteres.';render();return;}
    if(n1!==n2){S.erro='As duas senhas novas não são iguais.';render();return;}
    S.busy={txt:'Conferindo o código…'};render();
    let ok=false; try{ ok=await abrirCofre(cod,true); }catch(e){ ok=false; }
    if(!ok){ S.busy=null; falhouTentativa('Código incorreto.'); return; }
    try{ await novaSenha(n1); }catch(e){ S.busy=null; S.erro='Não consegui salvar a nova senha. Tente de novo.'; render(); return; }
    rawDel('tentativas'); S.busy=null; S.lock=null; S.erro=null; await carregarDados(); toast('Senha nova criada. O código de recuperação continua o mesmo.'); return;
  }
  if(f.id==='fTroca'){
    const at=document.getElementById('tAtual').value, n1=document.getElementById('tNova').value, n2=document.getElementById('tNova2').value;
    S.erro=null;
    if(n1.length<4){S.erro='A nova senha precisa ter pelo menos 4 caracteres.';render();return;}
    if(n1!==n2){S.erro='As duas senhas novas não são iguais.';render();return;}
    S.busy={txt:'Trocando a senha…'};render();
    let ok=false; try{ await desembrulhar(at,rawGet('cofre').senha); ok=true; }catch(e){}
    if(!ok){S.busy=null;S.erro='A senha atual está incorreta.';render();return;}
    try{ await novaSenha(n1); }catch(e){ S.busy=null; S.erro='Não consegui trocar a senha. Tente de novo.'; render(); return; }
    S.busy=null; S.sub=null; S.editPerfil=true; toast('Senha trocada.'); render(); window.scrollTo(0,0); return;
  }
  if(f.id==='fCfg'){
    lerCfgForm(); if(!S.cfg.chave){document.getElementById('cChave').focus();toast('Cole a chave de API.');return;}
    lsSet('cfg',S.cfg); const primeiro=!S.cfgVisto; S.cfgVisto=true; lsSet('cfgVisto',true); S.editCfg=false; S.erro=null;
    toast(primeiro?'Tudo pronto. Agora é só adicionar exames ou gerar o plano.':'Configuração salva.'); S.tab='inicio'; S.sub=null; render(); window.scrollTo(0,0); return;
  }
  if(f.id==='fPerfil'){
    const g=(id)=>document.getElementById(id).value.trim();
    if(!g('pNome')){document.getElementById('pNome').focus();toast('Preencha como quer ser chamado.');return;}
    const novo=!S.perfil;
    S.perfil={nome:g('pNome'),sexo:g('pSexo'),idade:g('pIdade'),altura:g('pAltura'),peso:g('pPeso'),objetivo:g('pObj'),nivel:g('pNivel'),local:g('pLocal'),dias:g('pDias'),minutos:g('pMin'),lesoes:g('pLesoes'),alimentacao:g('pAlim')};
    S.editPerfil=false; await save('perfil',S.perfil); if(!novo) toast('Perfil salvo.'); S.tab='inicio'; S.sub=null; render(); window.scrollTo(0,0);
  }
  else if(f.id==='fDig'){
    const tx=document.getElementById('dTexto').value.trim(); if(!tx){toast('Digite pelo menos um valor.');return;}
    lerExame(null,tx.slice(0,20000),document.getElementById('dTipo').value,document.getElementById('dData').value);
  }
  else if(f.id==='fRev'){
    syncRev(); const r=S.rascunho; delete r.avisos; r.itens=r.itens.filter(i=>i.nome&&String(i.valor).trim());
    S.exames=[r].concat(S.exames).sort((a,b)=>String(b.data).localeCompare(String(a.data)));
    await save('exames',S.exames); S.rascunho=null; S.sub=null; S.tab='exames'; toast('Exame salvo.'); render(); window.scrollTo(0,0);
  }
  else if(f.id==='fChat'){
    const el=document.getElementById('cMsg'); const q=el.value.trim(); if(!q||S.chat.some(m=>m.pend))return; perguntar(q.slice(0,2000));
  }
});
document.addEventListener('change',(ev)=>{
  if(ev.target.classList.contains('mostrar')){ const f=ev.target.closest('form'); f.querySelectorAll('input[type=password],input[data-pw]').forEach(i=>{i.dataset.pw='1';i.type=ev.target.checked?'text':'password';}); return; }
  if(ev.target.id==='cGuardei'){ S.guardei=ev.target.checked; const b=document.querySelector('[data-act=codigoOk]'); if(b) b.disabled=!S.guardei; return; }
  if(ev.target.id==='fArq'&&ev.target.files&&ev.target.files.length){ const fs=Array.from(ev.target.files); ev.target.value=''; lerExame(fs); }
  if(ev.target.id==='fImp'&&ev.target.files&&ev.target.files[0]){
    const f=ev.target.files[0]; ev.target.value='';
    f.text().then(async tx=>{
      let d; try{d=JSON.parse(tx);}catch(e){toast('Esse arquivo não é uma cópia do app.');return;}
      if(!d||d.app!=='treino-nutricao'){toast('Esse arquivo não é uma cópia do app.');return;}
      S.perfil=d.perfil||S.perfil; S.exames=Array.isArray(d.exames)?d.exames:[]; S.plano=d.plano||null; S.registro=d.registro&&d.registro.treinos?d.registro:{treinos:[]};
      await save('perfil',S.perfil); await save('exames',S.exames); await save('plano',S.plano); await save('registro',S.registro);
      S.editPerfil=false; S.tab='inicio'; toast('Cópia restaurada.'); render();
    });
  }
});

/* ---------- início ---------- */
function falhouTentativa(msg){
  const t=(rawGet('tentativas')||0)+1; try{rawSet('tentativas',t);}catch(e){}
  if(t>=5){ S.bloqAte=Date.now()+30000*Math.pow(2,Math.min(t-5,5)); tickBloqueio(); }
  S.erro=msg+(t>=5?' Muitas tentativas: espere para tentar de novo.':''); render();
}
function tickBloqueio(){ const t=setInterval(()=>{ if(!S.lock||Date.now()>=(S.bloqAte||0)){clearInterval(t);} if((S.lock==='entrar'||S.lock==='recuperar')&&!S.busy){ const ids=['sSenha','rCodigo','rNova','rNova2']; const vals=ids.map(i=>{const e=document.getElementById(i);return e?e.value:null;}); render(); ids.forEach((i,n)=>{const e=document.getElementById(i);if(e&&vals[n]!=null)e.value=vals[n];}); } },1000); }

function bloquear(){
  if(!COFRE.key) return;
  fecharCofre(); if(chatCtl) chatCtl.abort();
  Object.assign(S,{perfil:null,exames:[],plano:null,registro:{treinos:[]},feitos:{},cfg:null,chat:[],rascunho:null,busy:null,erro:null,sub:null,editPerfil:false,editCfg:false,ready:false,lock:'entrar',tab:'inicio',novoCodigo:null});
  window.scrollTo(0,0); render();
}

async function carregarDados(){
  const [perfil,exames,plano,registro]=await Promise.all([load('perfil',null),load('exames',[]),load('plano',null),load('registro',{treinos:[]})]);
  S.perfil=perfil; S.exames=Array.isArray(exames)?exames:[]; S.plano=plano; S.registro=registro&&registro.treinos?registro:{treinos:[]};
  S.feitos=lsGet('feitos')||{}; S.cfg=lsGet('cfg'); S.cfgVisto=!!lsGet('cfgVisto')||iaPronta();
  if(!S.cfg) S.cfg={provedor:'gemini',chave:'',modelo:''};
  S.ready=true; render(); window.scrollTo(0,0);
}

// bloqueio automático: 5 minutos em segundo plano
const BLOQ_MS=5*60*1000; let saiuEm=null;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ saiuEm=Date.now(); }
  else if(saiuEm&&COFRE.key&&Date.now()-saiuEm>=BLOQ_MS){ saiuEm=null; COFRE.fila.then(bloquear); }
  else saiuEm=null;
});

async function boot(){
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  if(!temCripto()){ S.lock='semCripto'; render(); return; }
  if(rawGet('cofre')){
    S.lock='entrar';
    const t=rawGet('tentativas')||0; if(t>=5){ S.bloqAte=Date.now()+30000; tickBloqueio(); }
  } else {
    S.migrar=CHAVES.some(k=>rawGet(k)!==null); S.lock='criar';
  }
  render(); setTimeout(()=>{const i=document.getElementById('sSenha');if(i)i.focus();},50);
}
boot();
})();
</script>
